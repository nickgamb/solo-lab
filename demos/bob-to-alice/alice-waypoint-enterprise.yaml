# Alice's waypoint on Enterprise: an agentgateway waypoint takes the mesh
# (HBONE) on its one listener, and uma-as's route attaches to the Service it
# serves, as for any waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: alice
  labels: {istio.io/waypoint-for: all}
spec:
  gatewayClassName: ${AGW_WAYPOINT_CLASS}   # agentgateway as the ambient waypoint
  infrastructure:
    parametersRef: {group: ${AGW_PARAMS_GROUP}, kind: ${AGW_PARAMS_KIND}, name: waypoint}
  listeners:
  - {name: mesh, port: 15008, protocol: HBONE}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: uma-as, namespace: alice}
spec:
  parentRefs: [{group: "", kind: Service, name: uma-as, port: 9000}]
  rules:
  - backendRefs: [{name: uma-as, port: 9000}]
