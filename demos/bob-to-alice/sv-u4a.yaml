# The requesting party's side of UMA: Sterling & Vance's U4A adapter. It holds
# Bob's agent's signing key (pseudonymous: a fresh key per pod) and does the
# UMA dance (ticket -> terms -> signed agreement -> PoP RPT) on the agent's
# behalf. Additive: nothing in story 1 changes; bob-assistant gets one more tool.
apiVersion: v1
kind: Namespace
metadata:
  name: sv-u4a
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient, pod-security.kubernetes.io/enforce: baseline, pod-security.kubernetes.io/warn: restricted, pod-security.kubernetes.io/audit: restricted}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: u4a-adapter, namespace: sv-u4a}
---
apiVersion: v1
kind: Service
metadata: {name: u4a-adapter, namespace: sv-u4a, labels: {lab.solo.io/mcp: alice-vault}}
spec:
  selector: {app: u4a-adapter}
  ports: [{name: mcp, port: 9030, targetPort: 9030, appProtocol: agentgateway.dev/mcp}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: u4a-adapter, namespace: sv-u4a}
spec:
  replicas: 1
  strategy: {type: Recreate}      # one agent key, one pending-grant table
  selector: {matchLabels: {app: u4a-adapter}}
  template:
    metadata: {labels: {app: u4a-adapter}}
    spec:
      serviceAccountName: u4a-adapter
      containers:
      - name: adapter
        image: localhost:${LAB_REGISTRY_PORT}/u4a/agent-adapter:${U4A_ADAPTER_TAG}
        ports: [{name: mcp, containerPort: 9030}]
        env:
        - {name: UMA4A_SHIM_TRANSPORT, value: streamable-http}
        - {name: UMA4A_SHIM_HOST, value: 0.0.0.0}
        - {name: UMA4A_SHIM_PORT, value: "9030"}
        # Meridian, across the internet (the edge).
        - {name: UMA4A_GATEWAY, value: "https://gateway.${MERIDIAN_DOMAIN}/mcp"}
        - {name: UMA4A_CACERT, value: /certs/ca.crt}
        - {name: UMA4A_KEYSTORE, value: /keys/agent-key.pem}
        - {name: UMA4A_STANDING_MAX_EXPIRES, value: "604800"}
        - {name: UMA4A_PEND_HANDBACK, value: "5"}
        volumeMounts:
        - {name: ca, mountPath: /certs, readOnly: true}
        - {name: keys, mountPath: /keys}
        resources:
          requests: {cpu: 20m, memory: 96Mi}
          limits: {memory: 256Mi}
        securityContext: {runAsNonRoot: true, runAsUser: 65532, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
      - {name: ca, configMap: {name: lab-ca-bundle}}
      - {name: keys, emptyDir: {medium: Memory}}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: sv-u4a}
spec: {mtls: {mode: STRICT}}
---
# Only the firm's gateway, which decides who may use the adapter (below).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: default-deny, namespace: sv-u4a}
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: adapter-callers, namespace: sv-u4a}
spec:
  selector: {matchLabels: {app: u4a-adapter}}
  action: ALLOW
  rules: [{from: [{source: {principals: [cluster.local/ns/agentgateway-system/sa/ai-gateway]}}], to: [{operation: {ports: ["9030"]}}]}]
---
# The adapter behind the firm's gateway, like every MCP server, at
#   http://ai-gateway.agentgateway-system.svc.cluster.local/mcp/alice-vault
#   user lane       Bob's agent's workers, acting for an advisor; the advisor's
#                   token stops here (the adapter speaks for the agent, by its
#                   own key, and takes no token)
#   discovery lane  no token -> only the kagent controller, and only to list
#                   tools: the adapter takes no token, so the gateway is what
#                   keeps a call off this lane
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata: {name: alice-vault, namespace: agentgateway-system}
spec:
  mcp:
    targets:
    - name: alice-vault
      selector:
        namespaces: {matchLabels: {kubernetes.io/metadata.name: sv-u4a}}
        services: {matchLabels: {lab.solo.io/mcp: alice-vault}}
---
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata: {name: alice-vault-discovery, namespace: agentgateway-system}
spec:
  mcp:
    targets:
    - name: alice-vault
      selector:
        namespaces:
          matchLabels: {kubernetes.io/metadata.name: sv-u4a}
        services:
          matchLabels: {lab.solo.io/mcp: alice-vault}
---
# The tools Bob's agent is given (agent/kustomization.yaml), and on the
# discovery lane only the listing of them.
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: alice-vault-tools, namespace: agentgateway-system}
spec:
  targetRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: alice-vault}]
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - 'mcp.tool.name in ["get_positions", "get_transactions", "execute_trade"]'
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: alice-vault-discovery-tools, namespace: agentgateway-system}
spec:
  targetRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: alice-vault-discovery}]
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - 'mcp.methodName == "tools/list" && mcp.tool.name in ["get_positions", "get_transactions", "execute_trade"]'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: alice-vault, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /mcp/alice-vault}
      headers: [{name: authorization, type: RegularExpression, value: "(?i)^bearer\\s+.+"}]
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: alice-vault}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: alice-vault-caller, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: alice-vault}]
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "sv-agents" && source.identity.serviceAccount == "bob-assistant" && "advisors" in jwt.groups'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: alice-vault-discovery, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /mcp/alice-vault}}]
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier: {remove: [authorization, x-id-token]}
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: alice-vault-discovery}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: alice-vault-discovery, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: alice-vault-discovery}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "kagent" && source.identity.serviceAccount == "kagent-controller"'
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata: {name: alice-vault-via-u4a, namespace: sv-agents}
spec:
  description: "Alice's accounts at Meridian Wealth, on Alice's terms (UMA for agents)"
  protocol: STREAMABLE_HTTP
  url: http://ai-gateway.agentgateway-system.svc.cluster.local/mcp/alice-vault
  sseReadTimeout: 300s
  terminateOnClose: false
  timeout: 300s
