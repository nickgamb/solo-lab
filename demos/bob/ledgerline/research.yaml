# Ledgerline Research's MCP service. Ledgerline is its own company: it trusts
# only tokens from its own authorization server (which it mints from ID-JAGs),
# and outsiders reach it only through the edge at https://mcp.ledgerline.lab.
#
# Protection is Ledgerline's own agentgateway, MCP-aware, plus STRICT mTLS and
# an L4 pin on the pods.
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: ledgerline-research
  namespace: ledgerline
spec:
  transportType: http
  httpTransport: {targetPort: 3000, path: /mcp}
  deployment:
    image: ${LEDGERLINE_RESEARCH_IMAGE}
    port: 3000
    env:
      RESEARCH_ISSUER: https://idp.${LEDGERLINE_DOMAIN}/realms/ledgerline
      RESEARCH_JWKS_URL: http://keycloak.ledgerline-identity.svc/realms/ledgerline/protocol/openid-connect/certs
      RESEARCH_CLIENTS: ${SV_CLIENT_AT_LEDGERLINE}   # S&V's client at Ledgerline's AS
    replicas: 2
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}
---
# Ledgerline's MCP gateway: an agentgateway in front of its MCP server. It
# reads each MCP request itself (JSON-RPC, not a header the caller sets) and
# decides per tool on Ledgerline's own token. A gateway, not a waypoint: the
# edge sends to endpoint (pod) addresses, which a service waypoint never sees.
apiVersion: ${AGW_PARAMS_API}
kind: ${AGW_PARAMS_KIND}
metadata: {name: mcp-gateway, namespace: ledgerline}
spec:
  istio:
    enabled: true              # SPIFFE cert from istiod; terminate HBONE inbound
  deployment:
    spec:
      replicas: 2
      template:
        metadata:
          # terminates HBONE itself, so source.identity is the caller's SPIFFE ID
          labels: {networking.istio.io/tunnel: http}
        spec:
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels: {gateway.networking.k8s.io/gateway-name: mcp-gateway}
  podDisruptionBudget:
    spec: {minAvailable: 1}
  service:
    spec: {type: ClusterIP}
  resources:
    requests: {cpu: 50m, memory: 96Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: mcp-gateway, namespace: ledgerline}
spec:
  gatewayClassName: ${AGW_CLASS}
  infrastructure:
    parametersRef: {group: ${AGW_PARAMS_GROUP}, kind: ${AGW_PARAMS_KIND}, name: mcp-gateway}
  listeners:
  - {name: mesh, protocol: HBONE, port: 15008, allowedRoutes: {namespaces: {from: Same}}}
  - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: Same}}}
---
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata: {name: research, namespace: ledgerline}
spec:
  mcp:
    targets:
    - name: research
      static:
        backendRef: {name: ledgerline-research}
        port: 3000
        path: /mcp
        protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: research, namespace: ledgerline}
spec:
  parentRefs: [{name: mcp-gateway, sectionName: http}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /mcp}}]
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: research}]
---
# Who may reach it: the internet, through the edge, and nothing else in the
# cluster. Every request needs a token from Ledgerline's AS (kept: the server
# checks it again); without one, a 401 and nothing more.
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: research-callers, namespace: ledgerline}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: research}]
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
      - issuer: https://idp.${LEDGERLINE_DOMAIN}/realms/ledgerline
        audiences: [ledgerline-research]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: ledgerline-identity, port: 80}
            jwksPath: /realms/ledgerline/protocol/openid-connect/certs
            cacheDuration: 5m
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "kgateway-system" && source.identity.serviceAccount == "edge"'
---
# What a token may do, per tool: any Ledgerline token may list the tools;
# research needs scope research:read; account_info a signed-in Ledgerline
# subject.
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: research-tools, namespace: ledgerline}
spec:
  targetRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: research}]
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - 'mcp.methodName == "tools/list"'
          - 'mcp.tool.name in ["sector_outlook", "research_note"] && has(jwt.scope) && "research:read" in jwt.scope.split(" ")'
          - 'mcp.tool.name == "account_info" && has(jwt.sub)'
---
# Ledgerline's identity team lets its gateway fetch the signing keys.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: gateway-to-keycloak, namespace: ledgerline-identity}
spec:
  from: [{group: ${AGW_POLICY_GROUP}, kind: ${AGW_POLICY_KIND}, namespace: ledgerline}]
  to: [{group: "", kind: Service, name: keycloak}]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: ledgerline}
spec: {mtls: {mode: STRICT}}
---
# L4, every pod in the namespace but the gateway's own: the gateway is the
# only way in. (The gateway terminates HBONE itself; its policy above names
# its callers.)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: pods-only-from-gateway, namespace: ledgerline}
spec:
  action: ALLOW
  rules:
  - from: [{source: {principals: ["cluster.local/ns/ledgerline/sa/mcp-gateway"]}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: research-mcp, namespace: ledgerline}
spec:
  parentRefs: [{name: edge, namespace: kgateway-system, sectionName: https-ledgerline}]
  hostnames: ["mcp.${LEDGERLINE_DOMAIN}"]
  rules:
  - backendRefs: [{name: mcp-gateway, port: 80}]
