# S&V's front door to Bob's workspace: the firm's gateway (ai-gateway), the
# one place that decides who may use which tool. Agents (and the kagent
# controller, listing tools) reach the workspace at
#   http://ai-gateway.agentgateway-system.svc.cluster.local/mcp/bob-workspace
# and the workspace takes connections from this gateway alone
# (10-workspace.yaml), so there is no path to Bob's tools that skips it.
#
#   who may call       an S&V agent WORKLOAD (source.identity, ns sv-agents)
#                      acting for an advisor (verified S&V token, group
#                      advisors), whose sign-in meets the workspace's
#                      assurance rule (the assurance gate)
#   what they may do   per-tool CEL: advisors get the read tools + log_followup;
#                      export_book is compliance-only (filtered out of lists)
#   what goes upstream NOT Bob's token: a token for the workspace alone,
#                      minted for the call, MCP_TOKEN_LIFETIME (agentgateway's
#                      STS on Enterprise, S&V's broker on OSS)
#
# Two lanes, split by HTTPRoute header match:
#   user lane       has a bearer token -> strict JWT, identity+group rule,
#                   assurance, per-tool CEL, a token minted for the workspace
#   discovery lane  no token -> only the kagent controller's SPIFFE identity;
#                   it can list tools (for the UI), and any call it attempts is
#                   refused by the server (no token)
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata:
  name: bob-workspace
  namespace: agentgateway-system
  labels: {lab.solo.io/owner: bob}
spec:
  mcp:
    targets:
    - name: bob-workspace
      selector:
        namespaces:
          matchLabels: {kubernetes.io/metadata.name: sv-mcp}
        services:
          matchLabels: {lab.solo.io/mcp: bob-workspace}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bob-workspace
  namespace: agentgateway-system
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /mcp/bob-workspace}
      headers: [{name: authorization, type: RegularExpression, value: "(?i)^bearer\\s+.+"}]
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: bob-workspace}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bob-workspace-discovery
  namespace: agentgateway-system
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /mcp/bob-workspace}
    # no user on this lane: nothing that looks like a credential goes on
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier: {remove: [authorization, x-id-token]}
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: bob-workspace-discovery}]
---
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata:
  name: bob-workspace-discovery
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: bob-workspace
      selector:
        namespaces:
          matchLabels: {kubernetes.io/metadata.name: sv-mcp}
        services:
          matchLabels: {lab.solo.io/mcp: bob-workspace}
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata:
  name: bob-workspace-discovery
  namespace: agentgateway-system
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: bob-workspace-discovery}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "kagent" && source.identity.serviceAccount == "kagent-controller"'
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata:
  name: bob-workspace-caller
  namespace: agentgateway-system
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: bob-workspace}]
  traffic:
    jwtAuthentication:
      ${ASSURANCE_JWT_KEEP}
      mode: Strict                # the user lane always carries a token
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
    authorization:
      action: Allow
      policy:
        matchExpressions:
        # one of the firm's agent workloads (its worker pool's ServiceAccount),
        # acting for an advisor
        - 'source.identity.namespace == "sv-agents" && source.identity.serviceAccount in ["bob-assistant", "advisor-desk"] && "advisors" in jwt.groups'
    # Workload profile advisor-workspace (05-workload-profiles.yaml): the
    # assurance rules (Rego; Solo's ext-auth service on Enterprise, the
    # assurance gate on OSS: config/lab.env) decide whether the IdP and
    # sign-in behind Bob's token meet it, from the verified token alone. No
    # answer, no request.
    ${ASSURANCE_POINT_OPEN}advisor-workspace${ASSURANCE_POINT_CLOSE}
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata:
  name: bob-workspace-tools
  namespace: agentgateway-system
spec:
  targetRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: bob-workspace}]
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - 'mcp.tool.name in ["whoami", "list_clients", "get_client", "get_meeting_notes", "log_followup"]'
          - 'has(jwt.groups) && "compliance" in jwt.groups'
      # every tool result through mcp-guard (25-mcp-guard.yaml) before the
      # agent sees it: account numbers and SSNs masked. Here, not in a policy
      # of its own: a second policy on this backend setting backend.mcp would
      # compete with this one.
      guardrails:
        processors:
        - remote:
            backendRef: {name: mcp-guard, port: 4445}
            failureMode: FailClosed   # no answer from the guard, no result
            metadata: {tool: 'mcp.tool.name'}
          methods: {"tools/call": Response}
    # The token the workspace accepts, for it alone and short-lived
    # (MCP_TOKEN_LIFETIME): minted by agentgateway's STS on Enterprise, else
    # exchanged at S&V's broker (scripts/idp.sh mcp_exchange). Bob's token
    # never goes upstream: the JWT policy removes it, or on Enterprise the
    # assurance rules do once they've decided.
    auth:
      oauthTokenExchange: ${MCP_EXCHANGE_WORKSPACE}
---
# Same tool surface on the discovery lane, so the UI never advertises a tool
# the firm withholds from advisors, and nothing but the listing.
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata:
  name: bob-workspace-discovery-tools
  namespace: agentgateway-system
spec:
  targetRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: bob-workspace-discovery}]
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - 'mcp.methodName == "tools/list" && mcp.tool.name in ["whoami", "list_clients", "get_client", "get_meeting_notes", "log_followup"]'
