# One MCP resource at the firm's front door, registered with agentgateway's
# OAuth issuer (Enterprise; platform/40-agentgateway/values-enterprise.yaml):
# ${MCP_PUBLIC_URL}/mcp/${ISSUER_RESOURCE}. Rendered once per resource by
# demos/bob/install.sh.
#
# The issuer takes resources only from a backend's MCP authentication, while
# the front door's own routes keep enforcing as before (22-ai-clients.yaml):
# so this backend carries the registration and serves the resource's
# authorization-server metadata, and never takes a call.
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata:
  name: issuer-resource-${ISSUER_RESOURCE}
  namespace: agentgateway-system
  labels: {lab.solo.io/issuer-resource: "${ISSUER_RESOURCE}"}
spec:
  mcp:
    targets:
    - name: none   # metadata only: no MCP traffic is routed here
      static: {host: issuer-resource.invalid, port: 443, path: /mcp, protocol: StreamableHTTP}
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata:
  name: issuer-resource-${ISSUER_RESOURCE}
  namespace: agentgateway-system
  labels: {lab.solo.io/issuer-resource: "${ISSUER_RESOURCE}"}
spec:
  targetRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: issuer-resource-${ISSUER_RESOURCE}}]
  backend:
    mcp:
      authentication:
        mode: Strict
        issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
          jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
          cacheDuration: 5m
        resourceMetadata: ${ISSUER_RESOURCE_METADATA}
---
# the resource's authorization-server metadata: the issuer's, for this resource
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: issuer-resource-${ISSUER_RESOURCE}
  namespace: agentgateway-system
  labels: {lab.solo.io/issuer-resource: "${ISSUER_RESOURCE}"}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  hostnames: ["mcp.${SV_DOMAIN}"]
  rules:
  - matches: [{path: {type: Exact, value: /.well-known/oauth-authorization-server/mcp/${ISSUER_RESOURCE}}}]
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: issuer-resource-${ISSUER_RESOURCE}}]
