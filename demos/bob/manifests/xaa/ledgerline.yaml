# Cross App Access (XAA / ID-JAG): Bob's agent -> Ledgerline Research.
# Owned by S&V, on the firm's egress gateway (ai-gateway): anything that leaves
# the firm leaves here, and cross-company credentials never reach the agent.
# agentgateway makes and checks every token request itself (crossAppAccess).
#
#   requesting app   kagent (the app Bob signed into); the egress is its back
#                    channel
#   subject          Bob's ID token, for the sign-in behind the access token
#                    the gateway verified (idtoken-exchange)
#   enterprise IdP   the voucher, per session: the IdP that signed Bob in, if
#                    it vouches for its own sign-ins (config/lab.env
#                    XAA_VOUCHER), from the ID token it issued; else S&V's
#                    broker, which vouches for every S&V user whichever IdP
#                    signed them in (scope xaa-ledgerline). Through a failover,
#                    the IdP that signs Bob in next vouches, or the broker.
#   resource AS      Ledgerline's (RESOURCE_AS): ID-JAG -> Ledgerline access
#                    token (RFC 7523); it trusts every voucher
#
# The call reaches Ledgerline in two hops on ai-gateway: the caller's route
# verifies Bob's token, asks the assurance rules, sets the ID token and names
# the voucher; ai-gateway's own route for that voucher (voucher.yaml) then
# makes the token requests. Both go out through ai-gateway's own routes
# (/xaa-legs/...), so the gateway's policies apply to them: the subject token
# and the ID-JAG are verified against the voucher, each request is held to
# this connection, and the access log keeps their claims, never the tokens.
# Only ai-gateway may call those routes.
#
# There is no lane without a user: Ledgerline lists nothing without its own
# token, and only a user's call gets one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: xaa-ledgerline, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /xaa/ledgerline}
      headers: [{name: authorization, type: RegularExpression, value: "(?i)^bearer\\s+.+"}]
    # on to ai-gateway's own route for the session's voucher (below), with
    # the voucher and the ID token this route's policy set
    filters:
    - type: URLRewrite
      urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /xaa-vouched/ledgerline}}
    backendRefs: [{kind: Service, name: ai-gateway, port: 80}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: xaa-ledgerline-caller, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: xaa-ledgerline}]
  traffic:
    jwtAuthentication:
      ${ASSURANCE_JWT_KEEP}
      mode: Strict
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
    authorization:
      action: Allow
      policy:
        matchExpressions:
        # one of the firm's agent workloads, acting for an advisor
        - >-
          source.identity.namespace == "sv-agents" && source.identity.serviceAccount in ["bob-assistant", "advisor-desk"]
          && "advisors" in jwt.groups
    # Workload profile ledgerline-research (05-workload-profiles.yaml): the
    # assurance rules (Rego; Solo's ext-auth service on Enterprise, the
    # assurance gate on OSS: config/lab.env) decide whether the IdP and
    # sign-in behind Bob's token meet it, before anything is exchanged, from
    # the verified token alone. No answer, no request.
    ${ASSURANCE_POINT_OPEN}ledgerline-research${ASSURANCE_POINT_CLOSE}
    # The subject of the ID-JAG exchange: Bob's ID token from the voucher,
    # for the sign-in behind the access token just verified. It replaces any
    # x-id-token the caller sent.
    #
    # Why not from the agent: kagent passes an agent the caller's access token,
    # not the ID token, and neither edition has a setting to pass it. Why not
    # agentgateway's own oauthTokenExchange: it requires token_type Bearer in
    # the response, while RFC 8693 2.2.1 has the IdP return N_A for a token
    # that isn't an access token, as Keycloak does for an ID token. So an
    # external processor (apps/idtoken-exchange) sets it, the same on both
    # editions. It gets the token verified above as metadata, request headers
    # only, and the request fails closed if it can't answer.
    extProc:
      backendRef: {kind: Service, name: idtoken-exchange, port: 8080}
      failureMode: FailClosed
      metadataContext:
        xaa: {subject_token: 'jwt.rawToken.unredacted()'}
      processingOptions:
        requestHeaderMode: Send
        requestBodyMode: None
        requestTrailerMode: Skip
        responseHeaderMode: Skip
        responseBodyMode: None
        responseTrailerMode: Skip
    # Who vouches: the IdP that signed this session in (the verified token's
    # idp claim), replacing any x-xaa-voucher the caller sent
    transformation:
      request:
        set: [{name: x-xaa-voucher, value: 'has(jwt.idp) ? string(jwt.idp) : "broker"'}]
---
# ---- the voucher, per session -----------------------------------------------
# The IdP that signed the session in vouches when it can (XAA_VOUCHER), and
# S&V's broker for every other session: one backend each (voucher.yaml). Only
# ai-gateway itself reaches this route, from the routes above and from S&V's
# front door (22-ai-clients.yaml), which set x-xaa-voucher and x-id-token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: xaa-ledgerline-vouched, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules: ${XAA_VOUCHED_RULES}
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: xaa-ledgerline-vouched, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: xaa-ledgerline-vouched}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "agentgateway-system" && source.identity.serviceAccount == "ai-gateway"'
---
# ---- the Ledgerline leg: ID-JAG -> Ledgerline access token -----------------
# The ID-JAG is verified against the vouchers (signature, iss, aud
# Ledgerline's AS, exp, sub), then
# held to this connection: typ oauth-id-jag+jwt, client_id S&V's client at
# Ledgerline, a lifetime of at most MCP_TOKEN_LIFETIME from the broker (300 s
# from an IdP, which sets its own), scopes within the connection's and the OIDC
# identity scopes an IdP adds (openid, profile, email). The client assertion
# the gateway signed goes on as sent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: xaa-as-ledgerline, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches: [{path: {type: Exact, value: /xaa-legs/ledgerline/as/token}, method: POST}]
    filters:
    - type: URLRewrite
      urlRewrite: {hostname: "${XAA_AS_HOST}", path: {type: ReplaceFullPath, replaceFullPath: "${XAA_AS_PATH}"}}
    backendRefs: [${XAA_AS_REF}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: xaa-as-ledgerline, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: xaa-as-ledgerline}]
  traffic:
    buffer: {request: {maxBytes: 65536, failureMode: FailClosed}}
    jwtAuthentication:
      mode: Strict
      location: {expression: 'form.decode(request.body).assertion'}
      providers: ${XAA_AS_PROVIDERS}
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - >-
          source.identity.namespace == "agentgateway-system" && source.identity.serviceAccount == "ai-gateway"
          && form.decode(request.body).grant_type == "urn:ietf:params:oauth:grant-type:jwt-bearer"
          && form.decode(request.body).assertion.split(".")[0].with(h,
               json(string(base64.decode(h.replace("-", "+").replace("_", "/") + ["", "===", "==", "="][size(h) % 4]))).typ)
             == "oauth-id-jag+jwt"
          && jwt.client_id == "${SV_CLIENT_AT_LEDGERLINE}"
          && int(jwt.exp) - int(jwt.iat) <= ${XAA_IDJAG_LIFETIME_CEL}
          && jwt.scope.split(" ").all(s, s in ${XAA_SCOPE_LIST} || s in ["openid", "profile", "email"])
---
# ---- idtoken-exchange: ai-gateway's external processor (apps/idtoken-exchange)
# Bob's ID token from S&V's broker, or the one his own IdP issued for his
# sign-in (UPSTREAM_IDP), as kagent (the requesting app).
apiVersion: v1
kind: ServiceAccount
metadata: {name: idtoken-exchange, namespace: agentgateway-system}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: idtoken-exchange, namespace: agentgateway-system}
spec:
  replicas: 2
  selector: {matchLabels: {app: idtoken-exchange}}
  template:
    metadata:
      labels: {app: idtoken-exchange}
    spec:
      serviceAccountName: idtoken-exchange
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: {matchLabels: {app: idtoken-exchange}}
      containers:
      - name: idtoken-exchange
        image: ${IDTOKEN_EXCHANGE_IMAGE}
        env:
        - {name: TOKEN_URL, value: http://keycloak.sv-identity/realms/sterling-vance/protocol/openid-connect/token}
        - {name: CLIENT_ID, value: kagent}
        - {name: UPSTREAM_IDPS, value: "${XAA_VOUCHER_IDPS}"}   # IdPs that vouch for their own sign-ins (XAA_VOUCHER); the broker for the rest
        ports:
        - {name: grpc, containerPort: 8080}
        - {name: health, containerPort: 8081}
        readinessProbe: {httpGet: {path: /healthz, port: health}}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: op, mountPath: /var/run/secrets/op, readOnly: true}
      volumes:
      - name: op
        secret: {secretName: kagent-client, items: [{key: clientSecret, path: sterling-vance}]}
---
apiVersion: v1
kind: Service
metadata: {name: idtoken-exchange, namespace: agentgateway-system}
spec:
  selector: {app: idtoken-exchange}
  ports: [{name: grpc, port: 8080, targetPort: grpc, appProtocol: kubernetes.io/h2c}]
---
# Only ai-gateway calls it, and only on the ext_proc port.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: idtoken-exchange-callers, namespace: agentgateway-system}
spec:
  selector: {matchLabels: {app: idtoken-exchange}}
  action: ALLOW
  rules:
  - from: [{source: {principals: [cluster.local/ns/agentgateway-system/sa/ai-gateway]}}]
    to: [{operation: {ports: ["8080"]}}]
