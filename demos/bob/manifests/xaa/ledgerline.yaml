# Cross App Access (XAA / ID-JAG): Bob's agent -> Ledgerline Research.
# Owned by S&V, on the firm's egress gateway (ai-gateway): anything that leaves
# the firm leaves here, and cross-company credentials never reach the agent.
# agentgateway makes and checks every token request itself (crossAppAccess).
#
#   requesting app   kagent (the app Bob signed into); the egress is its back
#                    channel. Users' stored upstream tokens: client xaa-egress
#   subject          Bob's ID token from the enterprise IdP that vouches for
#                    him (idtoken-exchange, below)
#   enterprise IdP   the IdP of Bob's session when it issues ID-JAGs, else
#                    S&V's broker: ID token -> ID-JAG for the approved
#                    connection (scope xaa-ledgerline), S&V authenticating as
#                    its client there (one backend per IdP: xaa/idp.yaml)
#   resource AS      Ledgerline's (RESOURCE_AS): ID-JAG -> Ledgerline access
#                    token (RFC 7523), S&V authenticating with private_key_jwt
#
# Both token requests go out through ai-gateway's own routes (/xaa-legs/...),
# so the gateway's policies apply to them: the subject token and the ID-JAG
# are verified against the IdP that issued them, each request is held to this
# connection, and the access log keeps their claims, never the tokens. Only
# ai-gateway may call those routes.
#
# Discovery lane: the kagent controller (no user) may list Ledgerline's public
# tool catalog; it can never obtain a Ledgerline token.
#
# Before routing: the IdP that vouches for the caller, from the verified token
# alone. x-vouching-idp is set on every request, replacing any value the
# caller sent; the XAA route picks that IdP's backend by it. Permissive: a
# request without an S&V token is left to its route's own policy.
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: xaa-vouching-idp, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: ai-gateway}]
  traffic:
    phase: PreRouting
    jwtAuthentication:
      mode: Permissive
      preserveToken: true
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
    transformation:
      request:
        set:
        # the session's IdP when it issues ID-JAGs (ENTERPRISE_IDP), else
        # S&V's broker: the same rule idtoken-exchange follows for the ID token
        - name: x-vouching-idp
          value: 'has(jwt.idp) && jwt.idp in ${XAA_UPSTREAM_NAMES} ? jwt.idp : "${XAA_BROKER}"'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: xaa-ledgerline, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  # one rule per IdP that may vouch, matched by x-vouching-idp
  rules: ${XAA_ROUTE_RULES}
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: xaa-ledgerline-caller, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: xaa-ledgerline}]
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
    authorization:
      action: Allow
      policy:
        matchExpressions:
        # one of the firm's agent workloads, acting for an advisor
        - >-
          source.identity.namespace == "sv-agents" && source.identity.serviceAccount in ["bob-assistant", "advisor-desk"]
          && "advisors" in jwt.groups
    # Workload profile ledgerline-research (05-workload-profiles.yaml): the
    # assurance gate decides whether the IdP and sign-in behind Bob's token
    # meet it, before anything is exchanged, from the verified claims alone
    # (never a header the caller could set). No answer from the gate, no
    # request.
    extAuth:
      backendRef: {kind: Service, name: assurance-gate, namespace: sv-identity, port: 9001}
      failureMode: FailClosed
      grpc:
        contextExtensions: {profile: ledgerline-research}
        requestMetadata:
          continuity: >-
            {"iss": jwt.iss, "sub": jwt.sub, "idp": has(jwt.idp) ? jwt.idp : "",
             "acr": has(jwt.idp_acr) ? jwt.idp_acr : "", "amr": has(jwt.idp_amr) ? jwt.idp_amr : "",
             "auth_time": has(jwt.idp_auth_time) ? jwt.idp_auth_time : 0}
    # The subject of the ID-JAG exchange: Bob's ID token, from the enterprise
    # IdP that vouches for him, for the access token just verified. It
    # replaces any x-id-token the caller sent.
    #
    # Why not from the agent: kagent passes an agent the caller's access token,
    # not the ID token, and neither edition has a setting to pass it. Why not
    # agentgateway's own oauthTokenExchange: it requires token_type Bearer in
    # the response, while RFC 8693 2.2.1 has the IdP return N_A for a token
    # that isn't an access token, as Keycloak does for an ID token. So an
    # external processor (apps/idtoken-exchange) sets it, the same on both
    # editions. It gets the token verified above as metadata, request headers
    # only, and the request fails closed if it can't answer.
    extProc:
      backendRef: {kind: Service, name: idtoken-exchange, port: 8080}
      failureMode: FailClosed
      metadataContext:
        xaa: {subject_token: 'jwt.rawToken.unredacted()'}
      processingOptions:
        requestHeaderMode: Send
        requestBodyMode: None
        requestTrailerMode: Skip
        responseHeaderMode: Skip
        responseBodyMode: None
        responseTrailerMode: Skip
---
# ---- the Ledgerline leg: ID-JAG -> Ledgerline access token -----------------
# Every IdP backend redeems its ID-JAG here. The ID-JAG is verified against
# the IdP that issued it (signature, iss, aud Ledgerline's AS, exp, sub), then
# held to this connection: typ oauth-id-jag+jwt, client_id S&V's client at
# Ledgerline, at most 300 s, scopes within the connection's and the OIDC
# identity scopes an IdP adds (openid, profile, email). The client assertion
# the gateway signed goes on as sent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: xaa-as-ledgerline, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches: [{path: {type: Exact, value: /xaa-legs/ledgerline/as/token}, method: POST}]
    filters:
    - type: URLRewrite
      urlRewrite: {hostname: "${XAA_AS_HOST}", path: {type: ReplaceFullPath, replaceFullPath: "${XAA_AS_PATH}"}}
    backendRefs: [${XAA_AS_REF}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: xaa-as-ledgerline, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: xaa-as-ledgerline}]
  traffic:
    buffer: {request: {maxBytes: 65536, failureMode: FailClosed}}
    jwtAuthentication:
      mode: Strict
      location: {expression: 'form.decode(request.body).assertion'}
      providers: ${XAA_IDJAG_PROVIDERS}
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - >-
          source.identity.namespace == "agentgateway-system" && source.identity.serviceAccount == "ai-gateway"
          && form.decode(request.body).grant_type == "urn:ietf:params:oauth:grant-type:jwt-bearer"
          && form.decode(request.body).assertion.split(".")[0].with(h,
               json(string(base64.decode(h.replace("-", "+").replace("_", "/") + ["", "===", "==", "="][size(h) % 4]))).typ)
             == "oauth-id-jag+jwt"
          && jwt.client_id == "${SV_CLIENT_AT_LEDGERLINE}"
          && int(jwt.exp) - int(jwt.iat) <= 300
          && jwt.scope.split(" ").all(s, s in ["xaa-ledgerline", "research:read", "openid", "profile", "email"])
---
# ---- discovery lane: kagent controller lists Ledgerline's public catalog ---------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: xaa-ledgerline-discovery, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /xaa/ledgerline}}]
    # no user on this lane: nothing that looks like a credential goes on
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier: {remove: [authorization, x-id-token]}
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: xaa-ledgerline-catalog}]
---
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata: {name: xaa-ledgerline-catalog, namespace: agentgateway-system}
spec:
  mcp:
    targets:
    - name: ledgerline-research
      static:
        host: mcp.${LEDGERLINE_DOMAIN}
        port: 443
        path: /mcp
        protocol: StreamableHTTP
        policies:
          tls:
            sni: mcp.${LEDGERLINE_DOMAIN}
            caCertificateRefs: [{name: lab-ca-bundle}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: xaa-ledgerline-discovery, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: xaa-ledgerline-discovery}]
  traffic:
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "kagent" && source.identity.serviceAccount == "kagent-controller"'
---
# ---- idtoken-exchange: ai-gateway's external processor (apps/idtoken-exchange)
# The enterprise IdPs that may vouch for Bob (OPS, scripts/idp.sh xaa_env) and
# S&V's client at each (the egress's key). The IdP of Bob's session vouches
# while S&V's identity continuity has it active; S&V's broker vouches for a
# sign-in through an IdP that doesn't issue ID-JAGs, and for its break-glass
# accounts. It reads Bob's stored upstream tokens from the broker as
# xaa-egress, which the broker allows for those IdPs only (Identity Brokering
# API v2).
apiVersion: v1
kind: ServiceAccount
metadata: {name: idtoken-exchange, namespace: agentgateway-system}
---
# read the continuity decision, nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: idtoken-exchange-continuity, namespace: sv-identity}
rules:
- apiGroups: [continuity.lab.solo.io]
  resources: [identitycontinuities]
  resourceNames: [sterling-vance]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: idtoken-exchange-continuity, namespace: sv-identity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: idtoken-exchange-continuity}
subjects: [{kind: ServiceAccount, name: idtoken-exchange, namespace: agentgateway-system}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: idtoken-exchange, namespace: agentgateway-system}
spec:
  replicas: 2
  selector: {matchLabels: {app: idtoken-exchange}}
  template:
    metadata:
      labels: {app: idtoken-exchange}
    spec:
      serviceAccountName: idtoken-exchange
      automountServiceAccountToken: true     # the continuity read above
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: {matchLabels: {app: idtoken-exchange}}
      containers:
      - name: idtoken-exchange
        image: ${IDTOKEN_EXCHANGE_IMAGE}
        env:
        - {name: OPS, value: '${XAA_OPS}'}
        - {name: CONTINUITY, value: sv-identity/sterling-vance}
        - {name: BROKER_CLIENT_ID, value: xaa-egress}         # reads stored upstream tokens, with the egress's key
        - {name: CA_FILE, value: /etc/lab-ca/ca.crt}            # S&V's own IdP, through the edge
        ports:
        - {name: grpc, containerPort: 8080}
        - {name: health, containerPort: 8081}
        readinessProbe: {httpGet: {path: /healthz, port: health}}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: op, mountPath: /var/run/secrets/op, readOnly: true}
        - {name: lab-ca, mountPath: /etc/lab-ca, readOnly: true}
      volumes:
      - name: lab-ca
        configMap: {name: lab-ca-bundle}
      - name: op
        projected:
          sources:
          - secret: {name: kagent-client, items: [{key: clientSecret, path: sterling-vance}]}
          - secret: {name: egress-client-key, items: [{key: signingKey, path: broker.key}, {key: signingKey, path: gluu.key},
              {key: signingKey, path: keycloak.key}]}
          - secret: {name: op-gluu, optional: true, items: [{key: clientSecret, path: gluu}]}
          - secret: {name: op-keycloak, optional: true, items: [{key: clientSecret, path: keycloak}]}
---
apiVersion: v1
kind: Service
metadata: {name: idtoken-exchange, namespace: agentgateway-system}
spec:
  selector: {app: idtoken-exchange}
  ports: [{name: grpc, port: 8080, targetPort: grpc, appProtocol: kubernetes.io/h2c}]
---
# Only ai-gateway calls it, and only on the ext_proc port.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: idtoken-exchange-callers, namespace: agentgateway-system}
spec:
  selector: {matchLabels: {app: idtoken-exchange}}
  action: ALLOW
  rules:
  - from: [{source: {principals: [cluster.local/ns/agentgateway-system/sa/ai-gateway]}}]
    to: [{operation: {ports: ["8080"]}}]
