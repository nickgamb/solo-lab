# AI clients outside the mesh (Claude Code, an IDE, any MCP client) reach the
# firm's tools through the same front door, by the edge:
#   https://mcp.${SV_DOMAIN}/mcp/bob-workspace   Bob's workspace
#   https://mcp.${SV_DOMAIN}/mcp/ledgerline      Ledgerline Research (Cross App Access)
# A client with no token is told where to sign in (401, protected-resource
# metadata, MCP authorization). The gateway names itself the authorization
# server and hands sign-in to S&V's broker, which redirects straight to the
# primary IdP (and to the next one on failover). The client never registers
# itself: the gateway gives every client the one S&V registered for them
# (sv-mcp-client: public, PKCE, loopback redirects).
#
# Then the same path as the firm's own agents (20-front-door.yaml,
# xaa/ledgerline.yaml): Bob's token is verified, the client and his groups and
# sign-in decide whether the call goes ahead, the tool must be on the list,
# and the server gets a token of its own for that one call: minted for the
# workspace, or, toward Ledgerline, a fresh ID-JAG that Ledgerline trades for
# its own token. Bob's token never leaves S&V. Ledgerline has no door of its
# own for S&V's users: there, a client gets a 401 and nothing else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: mcp-edge, namespace: agentgateway-system}
spec:
  parentRefs: [{name: edge, namespace: kgateway-system, sectionName: https-sterling}]
  hostnames: ["mcp.${SV_DOMAIN}"]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /mcp/}
    - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/mcp/}
    - path: {type: PathPrefix, value: /.well-known/oauth-authorization-server/mcp/}
    timeouts: {request: 300s}   # a tool call and its stream, not the edge's 15 s default
    backendRefs: [{name: ai-gateway, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: bob-workspace-clients, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  hostnames: ["mcp.${SV_DOMAIN}"]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /mcp/bob-workspace}
    - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/mcp/bob-workspace}
    - path: {type: PathPrefix, value: /.well-known/oauth-authorization-server/mcp/bob-workspace}
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: bob-workspace}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: ledgerline-clients, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  hostnames: ["mcp.${SV_DOMAIN}"]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /mcp/ledgerline}
    - path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/mcp/ledgerline}
    - path: {type: PathPrefix, value: /.well-known/oauth-authorization-server/mcp/ledgerline}
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: xaa-ledgerline}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: bob-workspace-clients, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: bob-workspace-clients}]
  traffic:
    jwtAuthentication:
      ${ASSURANCE_JWT_KEEP}
      mode: Strict
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
      mcp:
        provider: Keycloak
        clientId: sv-mcp-client
        resourceMetadata:
          scopesSupported: [openid, profile, email]
          bearerMethodsSupported: [header]
    authorization:
      action: Allow
      policy:
        matchExpressions:
        # an AI client S&V registered, through the edge, acting for an advisor
        - 'source.identity.namespace == "kgateway-system" && source.identity.serviceAccount == "edge" && jwt.azp == "sv-mcp-client" && "advisors" in jwt.groups'
    # the same assurance rule as the firm's own agents (advisor-workspace)
    ${ASSURANCE_POINT_OPEN}advisor-workspace${ASSURANCE_POINT_CLOSE}
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: ledgerline-clients, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: ledgerline-clients}]
  traffic:
    jwtAuthentication:
      ${ASSURANCE_JWT_KEEP}
      mode: Strict
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
      mcp:
        provider: Keycloak
        clientId: sv-mcp-client
        resourceMetadata:
          scopesSupported: [openid, profile, email]
          bearerMethodsSupported: [header]
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "kgateway-system" && source.identity.serviceAccount == "edge" && jwt.azp == "sv-mcp-client" && "advisors" in jwt.groups'
    # the same assurance rule as the firm's agents' way to Ledgerline
    ${ASSURANCE_POINT_OPEN}ledgerline-research${ASSURANCE_POINT_CLOSE}
    # the subject of the ID-JAG exchange, as for the firm's agents
    # (xaa/ledgerline.yaml): Bob's ID token from S&V's broker
    extProc:
      backendRef: {kind: Service, name: idtoken-exchange, port: 8080}
      failureMode: FailClosed
      metadataContext:
        xaa: {subject_token: 'jwt.rawToken.unredacted()'}
      processingOptions:
        requestHeaderMode: Send
        requestBodyMode: None
        requestTrailerMode: Skip
        responseHeaderMode: Skip
        responseBodyMode: None
        responseTrailerMode: Skip
