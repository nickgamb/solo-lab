# Bob's workspace: Sterling & Vance's MCP server for Bob's book of business.
# Owned by S&V, lives in sv-mcp. Nothing reaches it except through the
# namespace's waypoint, which is an agentgateway (20-waypoint.yaml).
#
# Checks, none of which trusts the one before it:
#   0. STRICT mTLS       plaintext to these pods is refused
#   1. ztunnel (L4)      only the mcp-waypoint identity may open a connection
#   2. mcp-waypoint (L7) caller must be an S&V agent workload (SPIFFE) acting
#                        for an advisor (JWT); per-tool CEL; then RFC 8693:
#                        the tool gets a token delegated to it, not Bob's
#   3. the server        verifies the delegated token (S&V's keys, issuer,
#                        aud=bob-workspace, expiry), acts as the token's user
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: bob-workspace
  namespace: sv-mcp
  labels: {lab.solo.io/owner: bob}
spec:
  transportType: http
  httpTransport:
    targetPort: 3000
    path: /mcp
  deployment:
    image: ${BOB_WORKSPACE_IMAGE}
    port: 3000
    env:
      WORKSPACE_ISSUER: https://idp.${SV_DOMAIN}/realms/sterling-vance
      WORKSPACE_JWKS_URL: http://keycloak.sv-identity.svc/realms/sterling-vance/protocol/openid-connect/certs
    replicas: 2
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}
---
# The MCP surface agents call: http://bob-workspace-mcp.sv-mcp:3000/mcp
# (kmcp's own Service carries no appProtocol). Waypoint-captured like every
# Service in sv-mcp.
apiVersion: v1
kind: Service
metadata:
  name: bob-workspace-mcp
  namespace: sv-mcp
  labels: {lab.solo.io/mcp: bob-workspace, lab.solo.io/owner: bob}
  annotations: {agentgateway.dev/mcp-path: /mcp}
spec:
  selector: {app.kubernetes.io/name: bob-workspace}
  ports:
  - {name: mcp, port: 3000, targetPort: 3000, appProtocol: agentgateway.dev/mcp}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict
  namespace: sv-mcp
spec:
  mtls: {mode: STRICT}
---
# L4, enforced by ztunnel on every pod in the namespace: the waypoint is the
# only way in, for bob-workspace and for any MCP server added beside it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pods-only-from-waypoint
  namespace: sv-mcp
spec:
  action: ALLOW
  rules:
  - from: [{source: {principals: ["cluster.local/ns/sv-mcp/sa/mcp-waypoint"]}}]
