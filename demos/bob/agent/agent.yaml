# Bob's agent. Owned by S&V, lives in sv-agents with its own ServiceAccount
# (kagent creates one per agent), so its SPIFFE ID is
#   spiffe://cluster.local/ns/sv-agents/sa/bob-assistant
# That identity is half of every authorization decision about Bob's tools;
# the other half is Bob's own token, which kagent propagates on each call.
# It runs on Agent Substrate: one snapshot-backed actor per conversation, on
# its own worker pool, whose pods run as that ServiceAccount.
#
# The agent holds no credentials of its own: no provider key (the firm's
# ai-gateway injects it) and no tool token (the same gateway mints each tool
# server a token of its own per call). Its model calls carry the user's own token
# (apiKeyPassthrough), so the gateway knows whose turn each call serves.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: firm-llm
  namespace: sv-agents
spec:
  provider: OpenAI
  model: lab-default             # overridden by the gateway (make llm)
  apiKeyPassthrough: true
  openAI:
    baseUrl: http://ai-gateway.agentgateway-system/v1
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: bob-workspace
  namespace: sv-agents
  labels: {lab.solo.io/owner: bob}
spec:
  description: "Bob's book of business at Sterling & Vance (clients, notes, follow-ups)"
  protocol: STREAMABLE_HTTP
  # The firm's front door to the workspace (manifests/20-front-door.yaml); the
  # workspace itself takes connections from that gateway alone.
  url: http://ai-gateway.agentgateway-system.svc.cluster.local/mcp/bob-workspace
  timeout: 60s
---
# An actor's calls leave through its worker pod, so the pool runs as Bob's
# agent: every existing policy that names sv-agents/sa/bob-assistant applies.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: bob-assistant
  namespace: sv-agents
  labels: {kagent.dev/worker-pool: bob-assistant, lab.solo.io/owner: bob}
spec:
  replicas: 2
  ateomImage: localhost:${LAB_REGISTRY_PORT}/kagent-dev/substrate/ateom-gvisor:${SUBSTRATE_LAB_TAG}
  template:
    serviceAccountName: bob-assistant
    annotations:
      istio.io/reroute-virtual-interfaces: ateom0   # actor egress through ztunnel, as the worker
      ambient.istio.io/dns-capture: "false"         # the actor's DNS is forwarded, not local
---
# Substrate resolves the actor's secret env at resume time: its config.
# Nothing else in sv-agents.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: substrate-env-sources, namespace: sv-agents}
rules:
- {apiGroups: [""], resources: [secrets], resourceNames: [bob-assistant], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: substrate-env-sources, namespace: sv-agents}
subjects: [{kind: ServiceAccount, name: ate-api-server, namespace: ate-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: substrate-env-sources}
---
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: bob-assistant
  namespace: sv-agents
  labels: {lab.solo.io/owner: bob}
spec:
  substrate:
    workerPoolRef: {name: bob-assistant}
  type: Declarative
  description: "Bob's advisory assistant at Sterling & Vance. Works his book of business, as Bob."
  declarative:
    modelConfig: firm-llm
    systemMessage: |
      You are the advisory assistant for a financial advisor at Sterling & Vance.
      You act on behalf of the advisor who is signed in, using only the tools you
      are given. Never invent client data: if a tool does not return it, say so.

      When asked who you are acting for, or what access you have, call `whoami`
      and report the identity, audience and token lifetime it returns.
      You have two tool sets: Bob's workspace at the firm (clients, notes,
      follow-ups) and Ledgerline Research, an external research provider
      (sector outlooks, research notes). Name the source of each fact.
      Before recording a follow-up, state exactly what you will log.
      Keep answers short and factual.
    deployment:
      env:
      # Forward the signed-in advisor's token on every tool call. The firm's
      # gateway verifies it, then mints the tool a token of its own; Bob's
      # never reaches the tool.
      - {name: KAGENT_PROPAGATE_TOKEN, value: "true"}
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: bob-workspace
        toolNames: [whoami, list_clients, get_client, get_meeting_notes, log_followup]
        # Human in the loop: Bob approves any write his agent makes.
        requireApproval: [log_followup]
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: ledgerline-research
        toolNames: [account_info, sector_outlook, research_note]
---
# Ledgerline Research: a SaaS S&V subscribes to, reached through Cross App
# Access on the firm's egress gateway (manifests/xaa/ledgerline.yaml).
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: ledgerline-research
  namespace: sv-agents
spec:
  description: "Ledgerline Research (external SaaS): sector outlooks and research notes, via Cross App Access"
  protocol: STREAMABLE_HTTP
  url: http://ai-gateway.agentgateway-system.svc.cluster.local/xaa/ledgerline/mcp
  timeout: 60s
