# Sterling & Vance mesh baseline: every S&V workload admits only the SPIFFE
# identities with business calling it. ALLOW policies with a selector are
# enforced by ztunnel at L4; a caller with no identity (outside the mesh)
# matches no principal and is refused.
#
# Every S&V namespace is STRICT. Agents run on Agent Substrate: an actor's
# calls leave through its worker pod, as the pool's ServiceAccount, and reach
# the actor only through Substrate's router (see docs/ARCHITECTURE.md).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: sv-identity}
spec: {mtls: {mode: STRICT}}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: sv-workforce}
spec: {mtls: {mode: STRICT}}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: sv-contingency}
spec: {mtls: {mode: STRICT}}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: kagent}
spec: {mtls: {mode: STRICT}}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: agentgateway-system}
spec: {mtls: {mode: STRICT}}
---
# The agentgateway proxies (ai-gateway) run outside the mesh and
# terminate HBONE themselves, so they dial the controller's xDS port without
# mesh mTLS. That one port stays PERMISSIVE; the rest of the controller is STRICT.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: controller-xds, namespace: agentgateway-system}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: ${AGW_RELEASE}}}   # the controller
  mtls: {mode: STRICT}
  portLevelMtls: {"9978": {mode: PERMISSIVE}}
---
# The STS (Enterprise, port 7777): only the gateway that mints the tokens MCP
# servers accept. MCP servers read its keys through that gateway
# (platform/40-agentgateway/sts.yaml), never from the STS, whose keys share a
# port with minting. An agent, or an MCP server, holding a user's token can't
# trade it there for one an MCP server would take.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: sts-callers, namespace: agentgateway-system}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: ${AGW_RELEASE}}}
  action: DENY
  rules:
  - from:
    - source:
        notPrincipals:
        - cluster.local/ns/agentgateway-system/sa/ai-gateway
    to: [{operation: {ports: ["7777"]}}]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: sv-agents}
spec: {mtls: {mode: STRICT}}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: strict, namespace: sv-egress}
spec: {mtls: {mode: STRICT}}
---
# sv-identity: nothing takes a connection unless a policy below names the
# caller. The broker holds every session and the controller's secrets sit
# beside it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: default-deny, namespace: sv-identity}
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: default-deny, namespace: sv-workforce}
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: default-deny, namespace: sv-contingency}
spec: {}
---
# Keycloak: the edge (browsers, SSO token calls), the firm's gateways (JWKS,
# token exchange), agentregistry, the continuity controller (admin API:
# upstream IdPs, login redirector, profile) and its profile sync (users).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: keycloak-callers, namespace: sv-identity}
spec:
  selector: {matchLabels: {app: keycloak}}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/kgateway-system/sa/edge
        - cluster.local/ns/agentgateway-system/sa/ai-gateway
        - cluster.local/ns/agentgateway-system/sa/idtoken-exchange   # Cross App Access: access token -> ID token
        - cluster.local/ns/agentgateway-system/sa/${AGW_RELEASE}   # controller: JWKS fetch
        - cluster.local/ns/sv-mcp/sa/bob-workspace      # OSS: verifies the broker's tokens (JWKS)
        - cluster.local/ns/agentregistry/sa/agentregistry
        - cluster.local/ns/sv-identity/sa/continuity-controller
        - cluster.local/ns/sv-identity/sa/continuity-sync
        - cluster.local/ns/observatory/sa/observatory    # its service-account token for kagent
---
# S&V's workforce IdP: browsers, and every in-lab caller of
# https://login.sterling.lab (the broker, the continuity controller, the
# egress, Ledgerline), arrive through the edge; the profile sync reads and
# writes users over the admin API directly. Its kill switch is a DENY in
# sv-workforce.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: keycloak-callers, namespace: sv-workforce}
spec:
  selector: {matchLabels: {app: keycloak}}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/kgateway-system/sa/edge
        - cluster.local/ns/sv-identity/sa/continuity-sync
---
# S&V's contingency IdP: the same, through the edge, and the profile sync
# over the admin API directly to keep its users current.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: keycloak-callers, namespace: sv-contingency}
spec:
  selector: {matchLabels: {app: keycloak}}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/kgateway-system/sa/edge
        - cluster.local/ns/sv-identity/sa/continuity-sync
---
# The continuity controller only calls out (Keycloak, upstreams, kube API).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: continuity-controller-callers, namespace: sv-identity}
spec:
  selector: {matchLabels: {app: continuity-controller}}
  action: ALLOW          # no rules: nothing in the mesh may call it
---
# So does its scheduled profile sync (Keycloak, upstream directories, kube API).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: continuity-sync-callers, namespace: sv-identity}
spec:
  selector: {matchLabels: {app: continuity-sync}}
  action: ALLOW
---
# The firm's way out: only its broker (brokered logins' back-channel), the
# continuity controller (health probes) and its profile sync (upstream
# directories) may reach upstream IdPs on the internet.
# A tier's partition is a DENY on its ServiceEntry, evaluated before this.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: egress-callers, namespace: sv-egress}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: egress-waypoint}]
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/sv-identity/sa/keycloak
        - cluster.local/ns/sv-identity/sa/continuity-controller
        - cluster.local/ns/sv-identity/sa/continuity-sync
---
# kagent: nothing in the namespace takes a connection unless a policy below
# names the caller. kagent-tools can act on the cluster, the controller trusts
# forwarded user claims, and the database holds every session.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: default-deny, namespace: kagent}
spec: {}
---
# kagent controller (:8083) trusts forwarded JWT claims WITHOUT verifying the
# signature (trusted-proxy mode; kagent 0.10 has no verifying mode), so this
# fence is what makes that safe. Two callers: the UI, which only forwards the
# access token the edge verified, and the agents' worker pools calling back
# with the token the controller handed their turn. The lab's checks call as
# the UI's ServiceAccount (a probe pod deleted when they exit). A new agent
# pool adds its ServiceAccount here. Every principal here can act as any user
# the controller is told about, so nothing joins for convenience: metrics are
# read from the mesh, not from the controller.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: kagent-controller-callers, namespace: kagent}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/kagent/sa/kagent-ui          # the UI, behind the edge's SSO
        - cluster.local/ns/kagent/sa/kagent-ops         # ops agents' workers
        - cluster.local/ns/sv-agents/sa/bob-assistant   # Bob's agent's workers
        - cluster.local/ns/sv-agents/sa/advisor-desk    # the advisor desk's workers
        - cluster.local/ns/observatory/sa/observatory   # Agent Substrate status, as its own service account
        - cluster.local/ns/agentregistry/sa/agentregistry-enterprise   # agentregistry's kagent runtime (Enterprise)
---
# kagent-tools can read the cluster: only through the firm's gateway, which
# decides who may use it (platform/60-kagent/front-door.yaml), like every MCP
# server.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: kagent-tools-callers, namespace: kagent}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: kagent-tools}}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/agentgateway-system/sa/ai-gateway
    to: [{operation: {ports: ["8084"]}}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: database-callers, namespace: kagent}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: database}}
  action: ALLOW
  rules:
  - from: [{source: {principals: [cluster.local/ns/kagent/sa/kagent-controller]}}]
---
# kmcp's controller only serves metrics to Prometheus.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: kmcp-callers, namespace: kagent}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: kmcp}}
  action: ALLOW
  rules:
  - from: [{source: {principals: [cluster.local/ns/observability/sa/kps-prometheus]}}]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: kagent-ui-callers, namespace: kagent}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: ui}}
  action: ALLOW
  rules:
  - from: [{source: {principals: [cluster.local/ns/kgateway-system/sa/edge]}}]
---
# The ops agents' workers: reached only through Substrate's router.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: ops-workers-callers, namespace: kagent}
spec:
  selector: {matchLabels: {ate.dev/worker-pool: kagent-ops}}
  action: ALLOW
  rules: [{from: [{source: {principals: [cluster.local/ns/ate-system/sa/atenet-router]}}]}]
---
# Bob's (and every advisor's) agents: reached only through Substrate's router,
# which only the kagent controller may use (platform/50-substrate/mesh.yaml).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: agents-only-via-substrate, namespace: sv-agents}
spec:
  action: ALLOW          # namespace-wide: every workload in sv-agents
  rules:
  - from: [{source: {principals: [cluster.local/ns/ate-system/sa/atenet-router]}}]
