profile: ambient
global:
  multiCluster:
    clusterName: ${MESH_NAME}
  network: ${MESH_NETWORK}
meshConfig:
  trustDomain: cluster.local
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  enableTracing: true
  extensionProviders:
  - name: otel-tracing
    opentelemetry:
      service: otel-collector.observability.svc.cluster.local
      port: 4317
  # each request a waypoint serves, as Agentshield reads it (layer 92): who
  # called (workload), what (Service), how and with what result. Used only
  # while Agentshield is on (telemetry.yaml).
  - name: agentshield
    envoyOtelAls:
      service: otel-collector.observability.svc.cluster.local
      port: 4317
      logName: agentshield-istio
      logFormat:
        labels:
          agentshield.telemetry.kind: active-probe
          agentshield.event.id: '%REQ(X-REQUEST-ID)%'
          agentshield.evidence.id: '%REQ(X-REQUEST-ID)%'
          agentshield.subject.k8s.api_version: apps/v1
          agentshield.subject.k8s.kind: Deployment
          agentshield.subject.k8s.namespace: '%FILTER_STATE(downstream_peer_obj:FIELD:namespace)%'
          agentshield.subject.k8s.name: '%FILTER_STATE(downstream_peer_obj:FIELD:workload)%'
          agentshield.object.k8s.api_version: v1
          agentshield.object.k8s.kind: Service
          agentshield.object.k8s.namespace: '%FILTER_STATE(upstream_peer_obj:FIELD:namespace)%'
          agentshield.object.k8s.name: '%FILTER_STATE(upstream_peer_obj:FIELD:service)%'
          agentshield.object.authority: '%REQ(:AUTHORITY)%'
          agentshield.operation: '%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%'
          agentshield.coverage: ambient-waypoint
          agentshield.probe.http_statuses: '%RESPONSE_CODE%'
          # the Service's full name, even for a request refused before it
          # left (the collector names the target from it)
          upstream.cluster: '%UPSTREAM_CLUSTER%'
pilot:
  # HA control plane: 2 replicas spread across zones, HPA to 4
  autoscaleEnabled: true
  autoscaleMin: 2
  autoscaleMax: 4
  replicaCount: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
  env:
    PILOT_ENABLE_IP_AUTOALLOCATE: "true"
    # RequestAuthentication JWKS on in-cluster IdPs is fetched by the proxy
    # enforcing it (a mesh identity the IdP can admit), not by istiod, which
    # runs outside the mesh; external issuers are still fetched by istiod
    PILOT_JWT_ENABLE_REMOTE_JWKS: hybrid
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector: {matchLabels: {app: istiod}}
