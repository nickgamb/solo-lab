controller:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {app.kubernetes.io/name: kgateway}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
