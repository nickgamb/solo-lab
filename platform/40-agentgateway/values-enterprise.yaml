licensing:
  createSecret: true
  licenseKey: ${SOLO_AGW_LICENSE_KEY}
# The STS: the token an MCP server accepts is minted here, at the gateway's
# request, per call, for that server alone (MCP_TOKEN_ISSUER, config/lab.env).
# It trusts S&V's broker's tokens as the subject and copies the user's claims
# the gateways and servers decide on; only gateways may reach it (mesh
# policy, platform/80-mesh-policy).
tokenExchange:
  enabled: true
  issuer: ${MCP_TOKEN_ISSUER}
  tokenExpiration: ${MCP_TOKEN_LIFETIME}
  allowedSubjectClaims: [groups, email, preferred_username, idp, idp_acr, idp_amr, idp_auth_time]
  subjectValidators:
  - validatorType: remote
    remoteConfig: {url: "http://keycloak.sv-identity.svc/realms/sterling-vance/protocol/openid-connect/certs"}
  actorValidators:
  - validatorType: k8s
  apiValidators:
  - validatorType: k8s
  # shared by the controller's replicas and kept across restarts
  # (sts-db.yaml); the chart takes the credentials in the URL only
  database:
    type: postgres
    postgres: {url: '${STS_DB_URL}'}
  # expired tokens and stale sign-ins removed, by one replica at a time
  maintenance: {enabled: true}
# Its OAuth issuer: the authorization server for AI clients outside the mesh
# at the firm's front door (demos/bob/manifests/22-ai-clients.yaml). It signs
# no tokens of its own: a client signs in through S&V's broker as the issuer's
# client there (sv-mcp-issuer) and gets the broker's token. Built by
# install.sh from config/lab.env (MCP_PUBLIC_URL, MCP_CLIENT_REDIRECT_URIS,
# MCP_CIMD_TRUSTED_DOMAINS).
controller:
  extraEnv:
    KGW_OAUTH_ISSUER_CONFIG: '${MCP_ISSUER_CONFIG}'
