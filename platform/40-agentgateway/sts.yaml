# The STS (Enterprise): S&V's gateways ask it for the token an MCP server
# accepts. Their policies name the controller's Service across namespaces.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: gateways-to-sts, namespace: agentgateway-system}
spec:
  from:
  - {group: ${AGW_POLICY_GROUP}, kind: ${AGW_POLICY_KIND}, namespace: sv-mcp}
  to: [{group: "", kind: Service, name: ${AGW_RELEASE}}]
