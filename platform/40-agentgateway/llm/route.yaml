# One OpenAI-compatible surface for the firm's agents (llm-callers, below):
#   http://ai-gateway.agentgateway-system/v1/chat/completions
# The backend behind it is swapped by `make llm` without touching kagent or
# any agent. The model name callers send is overridden by the backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: ai-gateway
  rules:
  - matches:
    - path: {type: PathPrefix, value: /v1}
    backendRefs:
    - group: ${AGW_BACKEND_GROUP}
      kind: ${AGW_BACKEND_KIND}
      name: llm
---
# Who may spend the firm's model credential: the agents' worker pools, by
# ServiceAccount (an actor's calls leave as its pool). A new agent pool adds
# its ServiceAccount here.
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata:
  name: llm-callers
  namespace: agentgateway-system
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm}]
  traffic:
    # whose turn a call serves: the user's S&V token, which kagent passes on
    # as the API key (apiKeyPassthrough). Verified and logged when valid;
    # Permissive, so a long turn whose token expired mid-way still finishes,
    # and the pool's identity below still decides who may call. Valid or not,
    # it stops here (transformation): no model provider ever sees it.
    jwtAuthentication:
      mode: Permissive
      providers:
      - issuer: https://idp.${SV_DOMAIN}/realms/sterling-vance
        audiences: [ai-gateway]
        jwks:
          remote:
            backendRef: {kind: Service, name: keycloak, namespace: sv-identity, port: 80}
            jwksPath: /realms/sterling-vance/protocol/openid-connect/certs
            cacheDuration: 5m
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - >-
          (source.identity.namespace == "sv-agents" && source.identity.serviceAccount in ["bob-assistant", "advisor-desk"])
          || (source.identity.namespace == "kagent" && source.identity.serviceAccount == "kagent-ops")
    transformation:
      request:
        remove: [authorization]
    # one retry: the call that finds a provider down goes to the next healthy
    # one (llm/policy.yaml takes the failed provider out of rotation)
    retry:
      attempts: 1
      codes: [429, 500, 502, 503, 504]
