# The model route for developers outside the mesh (a laptop, Claude Code):
# https://llm.${SV_DOMAIN}/v1, through the edge, with an API key. OpenAI
# chat completions and Anthropic messages both work, whatever the provider
# behind it (the gateway translates, llm/policy.yaml). The same guards and
# failover apply as on the agents' route. Keys live in the cluster only as
# SHA-256 hashes (ConfigMap llm-api-keys, written by make llm).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: llm-external-edge, namespace: agentgateway-system}
spec:
  parentRefs: [{name: edge, namespace: kgateway-system, sectionName: https-sterling}]
  hostnames: ["llm.${SV_DOMAIN}"]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]   # the model API, nothing else on the gateway
    timeouts: {request: 180s}                          # a model's answer, not the edge's 15 s default
    backendRefs: [{name: ai-gateway, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: llm-external, namespace: agentgateway-system}
spec:
  parentRefs: [{name: ai-gateway, sectionName: http}]
  hostnames: ["llm.${SV_DOMAIN}"]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]
    backendRefs: [{group: ${AGW_BACKEND_GROUP}, kind: ${AGW_BACKEND_KIND}, name: llm}]
---
apiVersion: ${AGW_POLICY_API}
kind: ${AGW_POLICY_KIND}
metadata: {name: llm-external, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm-external}]
  traffic:
    apiKeyAuthentication:
      mode: Strict
      configMapSelector: {matchLabels: {lab.solo.io/llm-api-keys: "true"}}
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - 'source.identity.namespace == "kgateway-system" && source.identity.serviceAccount == "edge"'
    retry:
      attempts: 1
      codes: [429, 500, 502, 503, 504]
