# Ollama on the host machine (scripts/llm.sh finds it), on :11434. It speaks
# both OpenAI chat completions and Anthropic messages, so each request goes
# out in the format it came in.
apiVersion: ${AGW_BACKEND_API}
kind: ${AGW_BACKEND_KIND}
metadata:
  name: llm
  namespace: agentgateway-system
  labels: {lab.solo.io/llm-provider: ollama}
spec:
  ai:
    provider:
      custom:
        model: ${OLLAMA_MODEL}
        providerOverride: ollama      # its name in cost, metrics and logs
        formats:
        - {type: Completions, path: /v1/chat/completions}
        - {type: Messages, path: /v1/messages}
      host: ${OLLAMA_HOST}
      port: ${OLLAMA_PORT}
