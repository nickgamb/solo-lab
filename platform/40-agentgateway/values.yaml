controller:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels: {app.kubernetes.io/name: agentgateway}
# Proxies join the ambient mesh natively (HBONE + SPIFFE identity), so mesh
# AuthorizationPolicies can name the gateway and it can call meshed backends
# with its own identity.
istio:
  autoEnabled: true
  clusterId: ${MESH_NAME}
  network: ${MESH_NETWORK}
monitoring:
  enabled: true
