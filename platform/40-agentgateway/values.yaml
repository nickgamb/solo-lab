controller:
  replicaCount: 2
  podDisruptionBudget:
    minAvailable: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels: {app.kubernetes.io/name: agentgateway}
# Proxies join the ambient mesh natively (HBONE + SPIFFE identity), so mesh
# AuthorizationPolicies can name the gateway and it can call meshed backends
# with its own identity.
istio:
  autoEnabled: true
  clusterId: ${MESH_NAME}
  network: ${MESH_NETWORK}
monitoring:
  enabled: true
  # The proxies' own metrics can't be scraped from inside the mesh: they take
  # HBONE themselves, and their HBONE listener doesn't serve the metrics port.
  # What they do is in their access logs (OTLP, platform/90-observatory).
  proxy: {podMonitor: {enabled: false}}
