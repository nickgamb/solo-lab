# Every namespace declares its party. Mesh membership, edge route admission
# and mesh policy all key off these labels. See docs/ARCHITECTURE.md. One
# namespace per party also names it for the observatory.
#
# Platform (neutral "cloud")
apiVersion: v1
kind: Namespace
metadata:
  name: kgateway-system
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
  annotations: {observatory.solo.io/party-name: "Platform"}
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
---
# Kiali, in the mesh (istio-system is not: istio-cni excludes it), so its
# callers are named by identity like everything else's.
apiVersion: v1
kind: Namespace
metadata:
  name: kiali
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
---
apiVersion: v1
kind: Namespace
metadata:
  name: observatory
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ops-identity
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
---
# Agent Substrate: control plane and router (workers run in each agent namespace)
apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
---
# Sterling & Vance — Bob's firm, runs the Solo AI platform
apiVersion: v1
kind: Namespace
metadata:
  name: sv-identity
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient}
  annotations: {observatory.solo.io/party-name: "Sterling & Vance"}
---
apiVersion: v1
kind: Namespace
metadata:
  name: kagent
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient}
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway-system
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient}
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentregistry
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient}
---
apiVersion: v1
kind: Namespace
metadata:
  name: sv-agents
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient}
---
apiVersion: v1
kind: Namespace
metadata:
  name: sv-mcp
  # S&V's tools sit behind an agentgateway waypoint (demos/bob/manifests/20-waypoint.yaml)
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient, istio.io/use-waypoint: mcp-waypoint}
---
apiVersion: v1
kind: Namespace
metadata:
  name: sv-egress
  # the firm's way out to internet services (egress waypoint, ServiceEntries)
  labels: {lab.solo.io/party: sterling-vance, istio.io/dataplane-mode: ambient}
---
# Alice — resource owner
apiVersion: v1
kind: Namespace
metadata:
  name: alice
  # waypoint opt-in is per workload (only uma-as needs L7 path rules)
  labels: {lab.solo.io/party: alice, istio.io/dataplane-mode: ambient}
  annotations: {observatory.solo.io/party-name: "Alice"}
---
apiVersion: v1
