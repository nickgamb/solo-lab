# Every namespace declares its party. Mesh membership, edge route admission
# and mesh policy all key off these labels. See docs/ARCHITECTURE.md.
#
# Platform (neutral "cloud")
apiVersion: v1
kind: Namespace
metadata:
  name: kgateway-system
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels: {lab.solo.io/party: platform, istio.io/dataplane-mode: ambient}
---
# Substrate: gVisor workers and atenet do their own networking; not meshed.
