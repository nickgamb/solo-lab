# continuity-controller: S&V's component, next to the Keycloak it drives.
# Reads its own credentials and each tier's client secret (sv-identity), owns
# the ServiceEntries for external upstreams (sv-egress) and the profile-sync
# CronJob (sv-identity), and reads partition policies in the egress (status
# only).
apiVersion: v1
kind: ServiceAccount
metadata: {name: continuity-controller, namespace: sv-identity}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: continuity-controller, namespace: sv-identity}
rules:
- apiGroups: [continuity.lab.solo.io]
  resources: [identitycontinuities]
  verbs: [get, list, watch, update, patch]
- apiGroups: [continuity.lab.solo.io]
  resources: [identitycontinuities/status]
  verbs: [get, update, patch]
- apiGroups: [continuity.lab.solo.io]
  resources: [identitycontinuities/finalizers]
  verbs: [update]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: ["", events.k8s.io]   # core: leader election; events.k8s.io: tier events
  resources: [events]
  verbs: [create, patch]
- apiGroups: [batch]               # the scheduled profile sync
  resources: [cronjobs]
  verbs: [get, create, update, patch, delete]
---
# The Secrets the controller may read, by name, and nothing else in
# sv-identity (not Keycloak's admin or signing-key Secrets). No list or watch:
# either would read every Secret in the namespace. Adding a tier adds its
# Secret here; the Observatory's rule builder does that when it stores a tier's
# client secret (it finds this Role by its label).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: continuity-controller-secrets
  namespace: sv-identity
  labels: {continuity.lab.solo.io/secrets-role: "true"}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [continuity-controller, upstream-okta, upstream-auth0, upstream-gluu, upstream-keycloak, upstream-contingency]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: continuity-controller-secrets, namespace: sv-identity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: continuity-controller-secrets}
subjects: [{kind: ServiceAccount, name: continuity-controller, namespace: sv-identity}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: continuity-controller, namespace: sv-identity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: continuity-controller}
subjects: [{kind: ServiceAccount, name: continuity-controller, namespace: sv-identity}]
---
# Creating a CronJob in sv-identity could otherwise mount any Secret there, so
# what the controller may create is pinned: the sync, as its own
# ServiceAccount, with no Secret reaching the pod except through the API.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: continuity-sync-cronjob}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sv-identity}}
    resourceRules:
    - {apiGroups: [batch], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [cronjobs]}
  matchConditions:
  - name: by-the-controller
    expression: "request.userInfo.username == 'system:serviceaccount:sv-identity:continuity-controller'"
  variables:
  - name: pod
    expression: "object.spec.jobTemplate.spec.template.spec"
  validations:
  - expression: "variables.pod.?serviceAccountName.orValue('') == 'continuity-sync'"
    message: "the continuity controller creates only the profile sync, which runs as continuity-sync"
  - expression: "!has(variables.pod.volumes) || variables.pod.volumes.all(v, !has(v.secret) && !has(v.projected) && !has(v.hostPath))"
    message: "the profile sync mounts no Secret, projected or host volume"
  - expression: "variables.pod.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)))) && !has(variables.pod.initContainers)"
    message: "the profile sync takes no Secret through its environment"
  - expression: "!variables.pod.?hostNetwork.orValue(false) && !variables.pod.?hostPID.orValue(false) && variables.pod.containers.all(c, !c.?securityContext.?privileged.orValue(false))"
    message: "the profile sync is not privileged"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: continuity-sync-cronjob}
spec:
  policyName: continuity-sync-cronjob
  validationActions: [Deny]
---
# The sync records its runs in status.sync. Everything else in status (which
# IdP is active, above all) is the controller's alone, and the egress reads
# it to decide who vouches.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: continuity-sync-status}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - {apiGroups: [continuity.lab.solo.io], apiVersions: [v1alpha1], operations: [UPDATE], resources: [identitycontinuities/status]}
  matchConditions:
  - name: by-the-sync
    expression: "request.userInfo.username == 'system:serviceaccount:sv-identity:continuity-sync'"
  validations:
  - expression: >-
      has(object.status) && has(oldObject.status) &&
      has(object.status.observedGeneration) == has(oldObject.status.observedGeneration) &&
      (!has(object.status.observedGeneration) || object.status.observedGeneration == oldObject.status.observedGeneration) &&
      has(object.status.broker) == has(oldObject.status.broker) &&
      (!has(object.status.broker) || object.status.broker == oldObject.status.broker) &&
      has(object.status.active) == has(oldObject.status.active) &&
      (!has(object.status.active) || object.status.active == oldObject.status.active) &&
      has(object.status.activeSince) == has(oldObject.status.activeSince) &&
      (!has(object.status.activeSince) || object.status.activeSince == oldObject.status.activeSince) &&
      has(object.status.egressNamespace) == has(oldObject.status.egressNamespace) &&
      (!has(object.status.egressNamespace) || object.status.egressNamespace == oldObject.status.egressNamespace) &&
      has(object.status.tiers) == has(oldObject.status.tiers) &&
      (!has(object.status.tiers) || object.status.tiers == oldObject.status.tiers) &&
      has(object.status.transitions) == has(oldObject.status.transitions) &&
      (!has(object.status.transitions) || object.status.transitions == oldObject.status.transitions) &&
      has(object.status.conditions) == has(oldObject.status.conditions) &&
      (!has(object.status.conditions) || object.status.conditions == oldObject.status.conditions)
    message: "the profile sync may change status.sync only"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: continuity-sync-status}
spec:
  policyName: continuity-sync-status
  validationActions: [Deny]
---
# The scheduled profile sync (a CronJob the controller keeps from spec.sync,
# running this image's "sync" command): reads its instance, records its run
# in status, and reads Secrets by name: its own realm client and each tier's
# directory credentials. It never sees the controller's or a tier's client
# secret. The Observatory adds a directory's Secret here when it stores one
# (it finds this Role by its label).
apiVersion: v1
kind: ServiceAccount
metadata: {name: continuity-sync, namespace: sv-identity}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: continuity-sync, namespace: sv-identity}
rules:
- apiGroups: [continuity.lab.solo.io]
  resources: [identitycontinuities]
  verbs: [get]
- apiGroups: [continuity.lab.solo.io]
  resources: [identitycontinuities/status]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: continuity-sync-secrets
  namespace: sv-identity
  labels: {continuity.lab.solo.io/sync-secrets-role: "true"}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [continuity-sync, directory-keycloak, directory-auth0]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: continuity-sync, namespace: sv-identity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: continuity-sync}
subjects: [{kind: ServiceAccount, name: continuity-sync, namespace: sv-identity}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: continuity-sync-secrets, namespace: sv-identity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: continuity-sync-secrets}
subjects: [{kind: ServiceAccount, name: continuity-sync, namespace: sv-identity}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: continuity-controller, namespace: sv-egress}
rules:
- apiGroups: [networking.istio.io]
  resources: [serviceentries]
  verbs: [get, list, watch, create, update, patch, delete]
# partitions (DENY on a tier's ServiceEntry) are read only here, in the egress
- apiGroups: [security.istio.io]
  resources: [authorizationpolicies]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: continuity-controller, namespace: sv-egress}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: continuity-controller}
subjects: [{kind: ServiceAccount, name: continuity-controller, namespace: sv-identity}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuity-controller
  namespace: sv-identity
  labels: {app: continuity-controller}
spec:
  replicas: 2                     # one leader (Lease continuity.lab.solo.io), one warm standby
  selector: {matchLabels: {app: continuity-controller}}
  template:
    metadata:
      labels: {app: continuity-controller}
    spec:
      serviceAccountName: continuity-controller
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: {matchLabels: {app: continuity-controller}}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller
        image: ${CONTINUITY_IMAGE}
        args: [--ca-file=/etc/lab-ca/ca.crt, --sync-image=${CONTINUITY_IMAGE}, --sync-ca-configmap=lab-ca-bundle]
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        ports:
        - {name: metrics, containerPort: 8080}
        - {name: health, containerPort: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: health}
        readinessProbe:
          httpGet: {path: /readyz, port: health}
        resources:
          requests: {cpu: 20m, memory: 48Mi}
          limits: {memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: lab-ca, mountPath: /etc/lab-ca, readOnly: true}
      volumes:
      - name: lab-ca
        configMap: {name: lab-ca-bundle}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: continuity-controller, namespace: sv-identity}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: continuity-controller}}
