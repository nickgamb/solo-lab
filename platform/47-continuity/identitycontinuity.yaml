# S&V's login chain (ENTERPRISE_IDP, config/lab.env): each of the firm's IdPs
# while it is healthy, in order, else the broker's break-glass accounts
# (platform admins). The broker stays the issuer S&V's own services trust
# either way. The install sets spec.tiers from
# ENTERPRISE_IDP; each tier's failover rules belong to its operators (the
# Observatory's rule builder edits them) and survive re-running the layer.
apiVersion: continuity.lab.solo.io/v1alpha1
kind: IdentityContinuity
metadata:
  name: sterling-vance
  namespace: sv-identity
spec:
  broker:
    keycloak:
      url: http://keycloak.sv-identity.svc
      realm: sterling-vance
      credentialsRef: {name: continuity-controller}
  # every S&V call to an upstream IdP leaves through this waypoint
  egress: {namespace: sv-egress, waypoint: egress-waypoint${XAA_EGRESS_EXPORT}}
  tiers: []   # from ENTERPRISE_IDP (install.sh)
  health: {intervalSeconds: 5, timeoutSeconds: 2, unhealthyThreshold: 2, healthyThreshold: 3}
  failback: Automatic
  # Which IdP each sign-in goes to: the identity fabric's routing, applied at
  # the firm's gateway (routing.yaml). First match wins; each rule names IdPs
  # in order, and the first that can sign people in now takes it. A sign-in
  # no rule matches goes to the active tier. The rules belong to S&V's
  # identity team (the Observatory edits them) and survive re-running the
  # layer. These two follow the chain: S&V's IdPs whose sign-ins can meet
  # AAL2, in failover order (install.sh), so people sign in at the primary
  # while it can.
  routing:
    policy: {apiVersion: ${AGW_POLICY_API}, kind: ${AGW_POLICY_KIND}, namespace: agentgateway-system, name: fabric-routing}
    rules:
    - name: ledgerline
      description: Sign-ins for Ledgerline Research go to an IdP that meets its assurance rule (AAL2), in failover order
      when: 'request.uri.matches("[?&]resource=https(%3A|:)(%2F|/){2}mcp.${SV_DOMAIN}(%2F|/)mcp(%2F|/)ledgerline")'
      idps: ${SV_AAL2_IDPS}
    - name: ai-clients
      description: AI clients outside the mesh (Claude Code, Codex, IDEs) sign in at an IdP that meets the workspace's assurance rule (AAL2), in failover order
      when: 'request.uri.matches("[?&]client_id=sv-mcp-(client|issuer)(&|$)")'
      idps: ${SV_AAL2_IDPS}
