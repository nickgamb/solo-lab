# S&V's login chain (ENTERPRISE_IDP, config/lab.env): each upstream IdP while
# it is healthy, in order, else the firm's own accounts. Keycloak stays the
# issuer S&V's own services trust either way. The install sets spec.tiers from
# ENTERPRISE_IDP; each tier's failover rules belong to its operators (the
# Observatory's rule builder edits them) and survive re-running the layer.
apiVersion: continuity.lab.solo.io/v1alpha1
kind: IdentityContinuity
metadata:
  name: sterling-vance
  namespace: sv-identity
spec:
  broker:
    keycloak:
      url: http://keycloak.sv-identity.svc
      realm: sterling-vance
      credentialsRef: {name: continuity-controller}
  # S&V's egress gateway has upstreams vouch for users (Cross App Access):
  # its calls to them leave through the same waypoint
  egress: {namespace: sv-egress, waypoint: egress-waypoint, exportTo: [agentgateway-system]}
  tiers: []   # from ENTERPRISE_IDP (install.sh)
  health: {intervalSeconds: 5, timeoutSeconds: 2, unhealthyThreshold: 2, healthyThreshold: 3}
  failback: Automatic
