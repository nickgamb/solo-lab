providers:
  default: openAI
  openAI:
    provider: OpenAI
    # Placeholder: agentgateway's backend overrides the model (make llm).
    model: lab-default
    apiKeySecretRef: kagent-llm
    apiKeySecretKey: API_KEY
    config:
      baseUrl: http://ai-gateway.agentgateway-system/v1

controller:
  # kagent v0.10.2 + tools/kagent (upstream PR candidates): ID token forwarding
  # and two SandboxAgent fixes (callback auth in the Go ADK, suspend race). The
  # controller pins the patched golang-adk by digest; other runtimes are the release's.
  image:
    registry: localhost:5001
    repository: kagent-dev/kagent/controller
    tag: 0.10.2-lab.3
  goAgentImage:
    registry: localhost:5001
    tag: 0.10.2-lab.3
  auth:
    mode: trusted-proxy
    userIdClaim: preferred_username
  # The edge (kgateway OAuth2) sets the user's ID token in the IdToken cookie.
  # The controller forwards it to agents as X-Id-Token, only when bound to the
  # authenticated user and issued to kagent. (0.10.2 chart has no
  # controller.auth.idToken values yet, hence env.)
  env:
  - {name: AUTH_ID_TOKEN_COOKIE, value: IdToken}
  - {name: AUTH_ID_TOKEN_AUDIENCE, value: kagent}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
  substrate:
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    atenetRouterURL: http://atenet-router.ate-system.svc:80
    ateApiInsecure: true
    defaultWorkerPool:
      name: kagent-ops

# The platform's own agents (below) run here, as kagent-ops: actors carry
# their worker's identity, and a pool with its own ServiceAccount only serves
# its own namespace (tools/substrate-mesh). Other namespaces bring their pool.
substrateWorkerPool:
  create: true
  name: kagent-ops
  replicas: 2
  ateomImage: localhost:5001/kagent-dev/substrate/ateom-gvisor:v0.0.9-lab.1
  sandboxClass: gvisor
  template:
    serviceAccountName: kagent-ops
    annotations:
      istio.io/reroute-virtual-interfaces: ateom0   # actor egress through ztunnel, as the worker
      ambient.istio.io/dns-capture: "false"         # the actor's DNS is forwarded, not local

ui:
  auth:
    ssoRedirectPath: /        # the edge already signed you in
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels: {app.kubernetes.io/component: ui}

otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: http://otel-collector.observability.svc.cluster.local:4317
        insecure: true
  logging:
    enabled: true
    exporter:
      otlp:
        endpoint: http://otel-collector.observability.svc.cluster.local:4317
        insecure: true

# Built-in agents: the chart only makes kind Agent, so install.sh renders the
# platform set (k8s, kgateway, istio, helm, promql) as SandboxAgents instead.
# Cilium/Argo agents target components this lab doesn't run; observability-agent
# needs a Grafana service-account token.
k8s-agent: {enabled: false}
kgateway-agent: {enabled: false}
istio-agent: {enabled: false}
helm-agent: {enabled: false}
promql-agent: {enabled: false}
observability-agent: {enabled: false}
argo-rollouts-agent: {enabled: false}
cilium-policy-agent: {enabled: false}
cilium-manager-agent: {enabled: false}
cilium-debug-agent: {enabled: false}

# Identity: SSO happens at the kgateway edge (edge-sso.yaml). The controller
# trusts the forwarded access token's claims WITHOUT verifying its signature,
# so 80-mesh-policy fences it: only the UI and the agents' worker pools, by
# ServiceAccount, reach :8083.

# The ops agents' tool server. The chart default binds it to cluster-admin and
# lets it write anything; here it reads (no Secrets), and refuses writes itself.
kagent-tools:
  tools:
    args: [--read-only]
  rbac:
    readOnly: true
    additionalRules:
    - apiGroups: [networking.istio.io, security.istio.io, telemetry.istio.io, gateway.networking.k8s.io,
        gateway.kgateway.dev, agentgateway.dev, kagent.dev, ate.dev, apiextensions.k8s.io]
      resources: ["*"]
      verbs: [get, list, watch]
