# What kagent-enterprise 0.5.10 needs beyond the chart, in this lab.
#
# Its UI is the Solo UI (the management chart, layer 90), at
# https://kagent.${SV_DOMAIN}: it signs Bob in through S&V's IdP and calls the
# controller with his token, which the controller verifies itself. Only the
# Solo UI may reach the controller's API on that behalf.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kagent-controller-solo-ui
  namespace: kagent
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
  action: ALLOW
  rules:
  - from: [{source: {principals: [cluster.local/ns/solo-enterprise/sa/solo-enterprise-ui]}}]
    to: [{operation: {ports: ["8083"]}}]
---
# The controller watches GatewayClasses (cluster-scoped). values.yaml scopes
# its roles to rbac.namespaces, so the chart grants no cluster-wide read; this
# is the one it needs, read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagent-controller-gatewayclasses
rules:
- apiGroups: [gateway.networking.k8s.io]
  resources: [gatewayclasses]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-controller-gatewayclasses
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kagent-controller-gatewayclasses}
subjects:
- {kind: ServiceAccount, name: kagent-controller, namespace: kagent}
