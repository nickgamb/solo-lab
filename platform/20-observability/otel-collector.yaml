mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
fullnameOverride: otel-collector
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
podDisruptionBudget:
  enabled: true
  minAvailable: 1
presets:
  kubernetesAttributes:
    enabled: true            # tag every span/metric with pod, namespace, deployment
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
        http: {endpoint: "0.0.0.0:4318"}
  processors:
    memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25}
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls: {insecure: true}
    otlphttp/prometheus:
      endpoint: http://kps-prometheus.observability.svc:9090/api/v1/otlp
      tls: {insecure: true}
    debug: {verbosity: basic}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/prometheus]
      logs:
        # No log store yet (Loki is an add-on); accept and drop so emitters
        # like kagent's OTel logs don't error.
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
