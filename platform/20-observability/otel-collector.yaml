mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
fullnameOverride: otel-collector
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
podDisruptionBudget:
  enabled: true
  minAvailable: 1
presets:
  kubernetesAttributes:
    enabled: true            # tag every span/metric with pod, namespace, deployment
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
        http: {endpoint: "0.0.0.0:4318"}
  processors:
    memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25}
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls: {insecure: true}
    otlphttp/prometheus:
      endpoint: http://kps-prometheus.observability.svc:9090/api/v1/otlp
      tls: {insecure: true}
    otlphttp/observatory:           # gateway access logs, live, to the observatory
      endpoint: http://observatory.observatory.svc:4318
      encoding: json
      tls: {insecure: true}
      retry_on_failure: {enabled: true, max_elapsed_time: 30s}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/prometheus]
      logs:
        # No log store (Loki is an add-on): logs stream to the observatory's
        # live view; other emitters' logs (kagent) are accepted and dropped there.
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/observatory]
