mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
fullnameOverride: otel-collector
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# 14317/14318: the gateways' access logs, the only logs the Observatory
# gets. A separate port so the mesh policy can name who may send them
# (mesh-policy.yaml): what arrives here is shown as verified by a gateway.
ports:
  access-grpc: {enabled: true, containerPort: 14317, servicePort: 14317, protocol: TCP, appProtocol: grpc}
  access-http: {enabled: true, containerPort: 14318, servicePort: 14318, protocol: TCP}
presets:
  kubernetesAttributes:
    enabled: true            # tag every span/metric with pod, namespace, deployment
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
        http: {endpoint: "0.0.0.0:4318"}
    otlp/access:
      protocols:
        grpc: {endpoint: "0.0.0.0:14317"}
        http: {endpoint: "0.0.0.0:14318"}
  processors:
    memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25}
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls: {insecure: true}
    otlphttp/prometheus:
      endpoint: http://kps-prometheus.observability.svc:9090/api/v1/otlp
      tls: {insecure: true}
    otlphttp/observatory:           # gateway access logs, live, to the observatory
      endpoint: http://observatory.observatory.svc:4318
      encoding: json
      tls: {insecure: true}
      retry_on_failure: {enabled: true, max_elapsed_time: 30s}
    nop: {}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/prometheus]
      logs/access:
        # gateway access logs, live, to the observatory
        receivers: [otlp/access]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/observatory]
      logs:
        # everything else's logs (kagent, Substrate): no log store here (Loki
        # is an add-on), so accepted and dropped
        receivers: [otlp]
        exporters: [nop]
