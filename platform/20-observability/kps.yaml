fullnameOverride: kps
alertmanager:
  enabled: false
# kind: these control-plane endpoints aren't reachable; scraping them only
# produces permanently firing TargetDown alerts.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 8GB
    scrapeInterval: 15s
    enableOTLPReceiver: true          # otel-collector pushes OTLP metrics here
    enableRemoteWriteReceiver: true   # Tempo metrics-generator writes here
    enableFeatures: [exemplar-storage]
    # pick up ServiceMonitors/PodMonitors from every chart, not only this one
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 1Gi}
# Grafana is signed in at the edge (platform/90-observatory/platform-uis.yaml):
# it trusts the user the edge forwards, and has no login form of its own. The
# local admin's password is generated (GRAFANA_ADMIN_PASSWORD in .lab/secrets.env).
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.${OPS_DOMAIN}
    auth.anonymous:
      enabled: false
    auth:
      disable_login_form: true
      disable_signout_menu: true
    auth.basic:
      enabled: false
    auth.proxy:
      enabled: true
      header_name: X-WEBAUTH-USER
      header_property: username
      auto_sign_up: true
    users:
      allow_sign_up: false
      auto_assign_org_role: Admin    # only platform admins can sign in at the edge
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      provider: {foldersFromFilesStructure: true}
    datasources:
      enabled: true
  additionalDataSources:
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo.observability.svc:3200
    jsonData:
      serviceMap: {datasourceUid: prometheus}
      nodeGraph: {enabled: true}
      tracesToMetrics: {datasourceUid: prometheus}
prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
