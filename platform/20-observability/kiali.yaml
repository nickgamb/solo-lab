# Kiali trusts whoever reaches it (anonymous): the sign-in is the edge's
# (platform/90-observatory/platform-uis.yaml), and its mesh policy
# (mesh-policy.yaml) admits only the edge and Prometheus. View-only: it shows
# the mesh's policy and cannot change it.
istio_namespace: istio-system      # Kiali runs in its own namespace, kiali
auth:
  strategy: anonymous
deployment:
  view_only_mode: true
  network_policy: {enabled: false}   # replaced by kiali-callers (mesh-policy.yaml)
  cluster_wide_access: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
server:
  web_fqdn: kiali.${OPS_DOMAIN}
  web_root: /
external_services:
  prometheus:
    url: http://kps-prometheus.observability.svc:9090
  grafana:
    enabled: true
    internal_url: http://kps-grafana.observability.svc
    external_url: https://grafana.${OPS_DOMAIN}
  tracing:
    enabled: true
    provider: tempo
    internal_url: http://tempo.observability.svc:3200
    use_grpc: false
    external_url: https://grafana.${OPS_DOMAIN}
