# Platform UIs on the edge (party: platform). SSO is layered on in 45-identity.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: grafana, namespace: observability}
spec:
  parentRefs: [{name: edge, namespace: kgateway-system, sectionName: https-ops}]
  hostnames: ["grafana.${OPS_DOMAIN}"]
  rules:
  - backendRefs: [{name: kps-grafana, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: kiali, namespace: istio-system}
spec:
  parentRefs: [{name: edge, namespace: kgateway-system, sectionName: https-ops}]
  hostnames: ["kiali.${OPS_DOMAIN}"]
  rules:
  - backendRefs: [{name: kiali, port: 20001}]
