# Substrate v0.0.9 + tools/substrate-mesh (worker pod identity, mesh-compatible
# actor networking), built into the lab registry. Unpatched components are
# mirrored there by digest under the same tag.
image:
  registry: localhost:${LAB_REGISTRY_PORT}/kagent-dev/substrate
  tag: ${SUBSTRATE_LAB_TAG}
atelet:
  # atelet pulls actor images itself; localhost:<registry port> means the lab registry.
  extraArgs: [--localhost-registry-replacement=lab-registry:5000]
# Substrate components export OTLP to the lab collector. Without an endpoint
# every component dials localhost:4317 and gets connection refused.
otel:
  endpoint: http://otel-collector.observability.svc.cluster.local:4317
valkey:
  replicas: 6            # 3 primaries + 3 replicas; valkey cluster minimum
