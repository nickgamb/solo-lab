# The identity team lets the firm's gateway use S&V's broker: its keys (every
# JWT policy on the ai-gateway), its token endpoint (the OSS exchange for MCP
# servers' tokens, Cross App Access).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateways-to-keycloak
  namespace: sv-identity
spec:
  from:
  - {group: ${AGW_POLICY_GROUP}, kind: ${AGW_POLICY_KIND}, namespace: agentgateway-system}
  - {group: agentgateway.dev, kind: AgentgatewayBackend, namespace: agentgateway-system}   # XAA stage 1 + IdP leg
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: agentgateway-system}  # XAA: the token request to S&V's broker
  to: [{group: "", kind: Service, name: keycloak}]
