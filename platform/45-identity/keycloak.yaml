# A Keycloak for one party. Rendered per party with PARTY_NS, PARTY_DOMAIN,
# PARTY_HOST, KC_REALM, KC_REALM_CM. The realm is re-imported from its ConfigMap on every
# start, so the realm lives as code; secrets in it are Keycloak's own ${ENV}
# placeholders, resolved from the kc-secrets Secret inside the container.
#
# Issuer is https://<host>.<party>.lab/realms/<realm> (host idp, or login for
# S&V's workforce IdP): the browser reaches
# it through the edge, and in-cluster callers too (CoreDNS sends *.lab to the
# edge), or directly at keycloak.<ns>.svc for backchannel calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: ${PARTY_NS}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ${PARTY_NS}
  labels: {app: keycloak}
spec:
  selector: {app: keycloak}
  ports:
  - {name: http, port: 80, targetPort: 8080}
  - {name: management, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ${PARTY_NS}
  labels: {app: keycloak}
spec:
  replicas: 1
  strategy: {type: Recreate}      # dev-file store is per-pod; realm re-imports on start
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata:
      labels: {app: keycloak}
      annotations:
        lab.solo.io/realm-checksum: "${KC_REALM_SHA}"
        lab.solo.io/key-checksum: "${KC_KEY_SHA}"
    spec:
      serviceAccountName: keycloak
      containers:
      - name: keycloak
        image: ${KC_IMAGE}
        args: ["start-dev", "--import-realm", "--features=${KC_FEATURES}"]
        env:
        - {name: KC_HOSTNAME, value: "https://${PARTY_HOST}.${PARTY_DOMAIN}"}
        - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
        - {name: KC_HTTP_ENABLED, value: "true"}
        - {name: KC_PROXY_HEADERS, value: xforwarded}
        - {name: KC_HEALTH_ENABLED, value: "true"}
        - {name: KC_METRICS_ENABLED, value: "true"}
        - {name: KC_LOG_LEVEL, value: "info"}
        # Trust the lab CA so this IdP can reach other parties over https via the edge
        # (e.g. an ID-JAG receiver fetching the issuing IdP's JWKS).
        - {name: KC_TRUSTSTORE_PATHS, value: /etc/lab-ca/ca.crt}
        - {name: SV_DOMAIN, value: "${SV_DOMAIN}"}
        - {name: OPS_DOMAIN, value: "${OPS_DOMAIN}"}
        - {name: ALICE_DOMAIN, value: "${ALICE_DOMAIN}"}
        - {name: MERIDIAN_DOMAIN, value: "${MERIDIAN_DOMAIN}"}
        - {name: LEDGERLINE_DOMAIN, value: "${LEDGERLINE_DOMAIN}"}
        - {name: LEDGERLINE_AS_ISSUER, value: "${LEDGERLINE_AS_ISSUER}"}   # S&V: the ID-JAG audience (config/lab.env RESOURCE_AS)
        - {name: XAA_UPSTREAMS, value: "${XAA_UPSTREAMS}"}                 # S&V: IdPs kagent may read Bob's stored tokens for
        - {name: KC_PASSWORD_GRANT, value: "${LAB_PASSWORD_GRANT}"}   # the realm's user-facing client (config/lab.env)
        envFrom:
        - secretRef: {name: kc-secrets}     # KC_BOOTSTRAP_ADMIN_* + client secrets for the realm placeholders
        - secretRef: {name: kc-realm-key}   # stable realm signing key (survives restarts)
        ports:
        - {name: http, containerPort: 8080}
        - {name: management, containerPort: 9000}
        readinessProbe:
          httpGet: {path: /health/ready, port: 9000}
          periodSeconds: 5
        startupProbe:
          httpGet: {path: /health/started, port: 9000}
          periodSeconds: 5
          failureThreshold: 60
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 1Gi}
        volumeMounts:
        - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
        - {name: lab-ca, mountPath: /etc/lab-ca, readOnly: true}
      volumes:
      - name: realm
        configMap: {name: ${KC_REALM_CM}}
      - name: lab-ca
        configMap: {name: lab-ca-bundle}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idp
  namespace: ${PARTY_NS}
spec:
  parentRefs: [{name: edge, namespace: kgateway-system, sectionName: ${PARTY_LISTENER}}]
  hostnames: ["${PARTY_HOST}.${PARTY_DOMAIN}"]
  # Only the party's realm (sign-in, tokens, keys, account) and the pages'
  # static assets are public. The admin console, the admin API and the master
  # realm answer 404 on the edge; admins use a port-forward (docs/COMMANDS.md).
  rules:
  - matches:
    - path: {type: PathPrefix, value: /realms/${KC_REALM}}
    - path: {type: PathPrefix, value: /resources}
    backendRefs: [{name: keycloak, port: 80}]
