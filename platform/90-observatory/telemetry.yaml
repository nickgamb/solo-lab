# Access logs from every gateway, over OTLP to the platform collector, which
# fans them out to the observatory. Each record carries who called (SPIFFE
# id, user, and the verified token's claims), what (MCP method and tool,
# model), and where it went. Raw tokens are never logged.
#
# agentgateway: S&V's ai-gateway and MCP waypoint, and Meridian's gateway.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata: {name: access-log, namespace: agentgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: ai-gateway}]
  frontend:
    accessLog:
      attributes:
        add:
        # the claims of the token the JWT policy verified (agentgateway redacts
        # the raw token); the observatory shows them on the request
        - {name: jwt, expression: 'jwt'}
        - {name: mcp.tool.name, expression: 'mcp.tool.name'}
        # a user's ID token riding along for cross-app access: noted, not logged
        - {name: token.x-id-token, expression: '"x-id-token" in request.headers'}
      otlp:
        url: http://otel-collector.observability.svc:4318
        protocol: HTTP
---
