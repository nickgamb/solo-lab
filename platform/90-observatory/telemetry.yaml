# kgateway: the edge.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata: {name: access-log, namespace: kgateway-system}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: edge}]
  default:
    httpSettings:
      accessLog:
      - openTelemetry:
          grpcService:
            logName: edge
            backendRef: {name: otel-collector, namespace: observability, port: 4317}
          body: '%REQ(:METHOD)% %REQ(:AUTHORITY)%%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %RESPONSE_CODE%'
          attributes:
            values:
            - {key: gateway, value: {stringValue: kgateway-system/edge}}
            - {key: http.method, value: {stringValue: '%REQ(:METHOD)%'}}
            - {key: http.host, value: {stringValue: '%REQ(:AUTHORITY)%'}}
            - {key: http.path, value: {stringValue: '%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%'}}
            - {key: http.status, value: {stringValue: '%RESPONSE_CODE%'}}
            - {key: duration, value: {stringValue: '%DURATION%'}}
            - {key: endpoint, value: {stringValue: '%UPSTREAM_HOST%'}}
            - {key: src.addr, value: {stringValue: '%DOWNSTREAM_REMOTE_ADDRESS%'}}
            - {key: route, value: {stringValue: '%ROUTE_NAME%'}}
            - {key: response.flags, value: {stringValue: '%RESPONSE_FLAGS%'}}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: edge-access-log, namespace: observability}
spec:
  from: [{group: gateway.kgateway.dev, kind: ListenerPolicy, namespace: kgateway-system}]
  to: [{group: "", kind: Service, name: otel-collector}]
