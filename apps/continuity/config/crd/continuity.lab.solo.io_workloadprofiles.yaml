---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: workloadprofiles.continuity.lab.solo.io
spec:
  group: continuity.lab.solo.io
  names:
    kind: WorkloadProfile
    listKind: WorkloadProfileList
    plural: workloadprofiles
    shortNames:
    - wlp
    singular: workloadprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.criticality
      name: CRITICALITY
      type: string
    - jsonPath: .spec.mode
      name: MODE
      type: string
    - jsonPath: .spec.assurance.minimum
      name: MINIMUM
      type: string
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .status.serving
      name: SERVING
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkloadProfile is a group of workloads' assurance rules: what a sign-in
          must prove to reach them, whichever IdP it came through, and which of the
          chain's IdPs may vouch for their users. A rule it leaves unset is its
          IdentityContinuity's assurancePolicy. The assurance gate enforces it at the
          workloads' policy points; requests it can't meet are refused (fail
          closed). Lives beside its IdentityContinuity, owned by whoever owns
          identity risk.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowBreakGlass:
                description: |-
                  Whether the broker's break-glass accounts (its local tier, platform
                  admins) may reach them. Unset: the assurancePolicy's.
                type: boolean
              allowedIdPs:
                description: |-
                  The chain's IdPs that may vouch for a session here (by tier name).
                  Unset: the assurancePolicy's.
                items:
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              assurance:
                description: |-
                  ProfileAssurance is what a sign-in must prove (NIST SP 800-63B), judged by
                  what its upstream IdP asserted (the IdP's tier assurance). Without the
                  evidence a requirement needs, the request is refused. Each field unset is
                  the assurancePolicy's.
                properties:
                  maxAge:
                    description: |-
                      How long ago the user may have authenticated at the IdP (its
                      auth_time), e.g. "12h".
                    type: string
                  minimum:
                    enum:
                    - AAL1
                    - AAL2
                    - AAL3
                    type: string
                  phishingResistant:
                    description: The authenticator must resist phishing (FIDO2/WebAuthn,
                      smart card).
                    type: boolean
                type: object
              clients:
                description: The broker clients users sign in through to reach them.
                items:
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              continuity:
                description: |-
                  The IdentityContinuity (in this namespace) whose sign-ins these
                  workloads take.
                minLength: 1
                type: string
              criticality:
                description: Business impact.
                enum:
                - Critical
                - High
                - Standard
                type: string
              description:
                description: What these workloads say they are, in a sentence.
                maxLength: 512
                type: string
              mode:
                default: Enforce
                description: |-
                  What the assurance gate does with these rules. Enforce: a request
                  they refuse is refused. ReportOnly: it is let through, and the gate
                  logs and returns what it would have decided (would-deny), to see a
                  rule's effect before enforcing it. Off: every request is let through.
                enum:
                - Enforce
                - ReportOnly
                - "Off"
                type: string
              obligations:
                description: |-
                  What the business owes for them: regulations, policies, contracts.
                  Free-form tags, for reporting.
                items:
                  maxLength: 64
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              owner:
                description: Who answers for them.
                maxLength: 128
                type: string
              sessions:
                description: |-
                  Any: a session from an allowed IdP, for as long as it lasts.
                  ActiveIdPOnly: only sessions from the IdP signing people in now; a
                  session from one the chain has moved off is refused until the user
                  signs in again. Unset: the assurancePolicy's.
                enum:
                - Any
                - ActiveIdPOnly
                type: string
              workloads:
                description: |-
                  The workloads, by mesh identity: what the Observatory maps their
                  identity dependencies from.
                items:
                  properties:
                    namespace:
                      minLength: 1
                      type: string
                    serviceAccount:
                      minLength: 1
                      type: string
                  required:
                  - namespace
                  - serviceAccount
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
            required:
            - continuity
            - criticality
            type: object
          status:
            properties:
              clients:
                description: |-
                  The broker clients users reach these workloads through, as the broker
                  has them registered.
                items:
                  properties:
                    assuranceScope:
                      description: |-
                        Its tokens carry the upstream's assurance (continuity-assurance scope):
                        without it, no request through it can prove more than nothing.
                      type: boolean
                    audiences:
                      description: The audiences its access tokens carry (its audience
                        mappers).
                      items:
                        type: string
                      type: array
                    clientID:
                      type: string
                    found:
                      type: boolean
                    redirectURIs:
                      description: Where the broker sends its users back to.
                      items:
                        type: string
                      type: array
                  required:
                  - assuranceScope
                  - clientID
                  - found
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - clientID
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              eligibleIdPs:
                description: The chain's IdPs, in order, whose sign-ins can meet the
                  profile.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  Available: sign-ins through the IdP serving now can meet the profile,
                  at the profile's preferred IdP. Degraded: they can, on a later IdP in
                  the chain. FailedClosed: they can't; requests are refused until the
                  chain moves to an IdP that can, or the user's IdP steps them up.
                enum:
                - Available
                - Degraded
                - FailedClosed
                type: string
              serving:
                description: The IdP signing people in now (the IdentityContinuity's
                  active tier).
                type: string
              servingLevel:
                description: The most a sign-in through it can prove.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
