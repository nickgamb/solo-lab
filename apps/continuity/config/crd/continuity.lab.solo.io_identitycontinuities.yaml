---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: identitycontinuities.continuity.lab.solo.io
spec:
  group: continuity.lab.solo.io
  names:
    kind: IdentityContinuity
    listKind: IdentityContinuityList
    plural: identitycontinuities
    shortNames:
    - idc
    singular: identitycontinuity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.active
      name: ACTIVE
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IdentityContinuity keeps a broker (Keycloak) signing users in through the
          first healthy tier of an ordered chain of upstream IdPs, with the broker's
          own accounts as a break-glass tier. The broker stays the only issuer
          relying parties trust; upstreams only authenticate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              assurancePolicy:
                default: {}
                description: |-
                  The assurance rules every WorkloadProfile following this chain has,
                  unless it sets its own.
                properties:
                  allowBreakGlass:
                    description: The broker's break-glass accounts may reach workloads.
                    type: boolean
                  allowedIdPs:
                    description: 'The chain''s IdPs that may vouch for a session.
                      Empty: every upstream.'
                    items:
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  maxAge:
                    type: string
                  minimum:
                    default: AAL1
                    enum:
                    - AAL1
                    - AAL2
                    - AAL3
                    type: string
                  phishingResistant:
                    type: boolean
                  sessions:
                    default: Any
                    enum:
                    - Any
                    - ActiveIdPOnly
                    type: string
                type: object
              broker:
                properties:
                  keycloak:
                    properties:
                      browserFlow:
                        default: continuity-browser
                        description: Browser flow whose Identity Provider Redirector
                          points at the active tier.
                        type: string
                      credentialsRef:
                        description: |-
                          Secret with client-id and client-secret of a service-account client
                          holding realm-management manage-identity-providers and manage-realm.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      firstBrokerLoginFlow:
                        default: continuity-first-broker-login
                        description: First-broker-login flow for every upstream (links
                          to existing users).
                        type: string
                      realm:
                        type: string
                      url:
                        description: |-
                          In-cluster base URL of Keycloak (admin API and token endpoint): a
                          cluster Service, e.g. http://keycloak.sv-identity.svc.
                        pattern: ^https?://[a-z0-9.-]+\.svc(\.cluster\.local)?(:[0-9]+)?/?$
                        type: string
                    required:
                    - credentialsRef
                    - realm
                    - url
                    type: object
                required:
                - keycloak
                type: object
              egress:
                description: |-
                  Egress, when set, sends back-channel calls to upstreams outside
                  internalDomains through an egress waypoint (one ServiceEntry per tier).
                properties:
                  exportTo:
                    description: |-
                      Other namespaces whose workloads call the upstreams on the broker's
                      behalf (e.g. the gateway that has an upstream vouch for its users):
                      the ServiceEntries are exported to them too, so their calls leave
                      through the same waypoint and a partition cuts them as well.
                    items:
                      type: string
                    type: array
                  internalDomains:
                    default:
                    - lab
                    - svc
                    - cluster.local
                    description: Hosts under these domains are in-cluster names and
                      need no ServiceEntry.
                    items:
                      type: string
                    type: array
                  namespace:
                    type: string
                  waypoint:
                    type: string
                required:
                - namespace
                - waypoint
                type: object
              failback:
                default: Automatic
                description: |-
                  Automatic moves back up the chain as soon as a higher tier is healthy
                  again; Manual stays on the current tier until it fails.
                enum:
                - Automatic
                - Manual
                type: string
              health:
                default: {}
                properties:
                  healthyThreshold:
                    default: 3
                    format: int32
                    minimum: 1
                    type: integer
                  intervalSeconds:
                    default: 5
                    format: int32
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    default: 2
                    format: int32
                    minimum: 1
                    type: integer
                  unhealthyThreshold:
                    default: 2
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              profile:
                description: |-
                  S&V's standard user profile on the broker: the attributes the
                  directory sync maps every IdP's profile into. Optional.
                properties:
                  attributes:
                    description: |-
                      Attributes beyond the built-in username, email, firstName and lastName,
                      added to the realm's user profile. Users can view but not edit them:
                      their values come from the primary IdP.
                    items:
                      properties:
                        displayName:
                          type: string
                        multivalued:
                          description: Holds a list of values; otherwise one.
                          type: boolean
                        name:
                          description: The attribute's name in the broker's user profile.
                          maxLength: 64
                          pattern: ^[a-zA-Z][a-zA-Z0-9_.-]*$
                          type: string
                        type:
                          default: string
                          description: |-
                            The value's type, checked by the broker when a value is written:
                            string, integer, number, boolean (true or false), date (yyyy-mm-dd),
                            email or uri.
                          enum:
                          - string
                          - integer
                          - number
                          - boolean
                          - date
                          - email
                          - uri
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  domains:
                    description: |-
                      The workforce's email domains (e.g. sterling.lab). The directory sync
                      gives the broker an account for each user of the primary IdP whose
                      verified email is under one of them; empty, it creates none.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  groups:
                    description: |-
                      The groups in the shape: the broker keeps them, and each IdP's own
                      groups (or roles) map into them by name (tiers[].groups). Membership
                      always comes from an IdP, never from the broker: at sign-in from the
                      IdP's groups claim, and in the directory sync from the primary.
                    items:
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                type: object
              sync:
                description: |-
                  The scheduled directory sync: the primary IdP's profile into the
                  broker, then the broker's out to every failover IdP. Optional.
                properties:
                  credentialsRef:
                    default:
                      name: continuity-sync
                    description: |-
                      A Secret with client-id and client-secret of the broker's realm client
                      the sync writes users as (view-users and manage-users; nothing else).
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  schedule:
                    description: |-
                      Standard cron, in UTC (e.g. "0 2 * * *" daily at 02:00). Empty only
                      while suspended.
                    type: string
                  suspend:
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: a schedule, unless suspended
                  rule: (has(self.suspend) && self.suspend) || (has(self.schedule)
                    && size(self.schedule) > 0)
              tiers:
                description: 'Ordered: the first eligible, healthy tier is active.'
                items:
                  properties:
                    assurance:
                      description: |-
                        What a sign-in through this IdP proves, for workload profiles that
                        require an assurance level. Unset: every sign-in counts as AAL1.
                      properties:
                        default:
                          default: AAL1
                          description: |-
                            The level of a sign-in whose acr and amr match no entry: what this
                            IdP's sign-in policy for S&V's client guarantees on its own (a local
                            tier's only level).
                          enum:
                          - AAL1
                          - AAL2
                          - AAL3
                          type: string
                        levels:
                          items:
                            properties:
                              acr:
                                description: |-
                                  The IdP's acr value, exactly (e.g. "aal2", "phr",
                                  "http://schemas.openid.net/pape/policies/2007/06/multi-factor").
                                maxLength: 256
                                type: string
                              amr:
                                description: One amr value (RFC 8176, e.g. "mfa",
                                  "otp", "hwk").
                                maxLength: 64
                                type: string
                              level:
                                enum:
                                - AAL1
                                - AAL2
                                - AAL3
                                type: string
                              phishingResistant:
                                description: |-
                                  The authenticator resists phishing (FIDO2/WebAuthn, smart card): what
                                  AAL3 requires, and what a profile can require at any level.
                                type: boolean
                            required:
                            - level
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of acr or amr
                              rule: has(self.acr) != has(self.amr)
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: atomic
                      type: object
                    attributes:
                      description: |-
                        This IdP's attributes, paired with the broker's profile for the
                        directory sync. oidc tiers only.
                      items:
                        description: |-
                          AttributeMapping pairs a broker profile attribute with the IdP's own
                          attribute. The primary IdP's is read into the broker's; a failover's is
                          written from it.
                        properties:
                          attribute:
                            description: The broker's profile attribute (built-in
                              or spec.profile.attributes).
                            minLength: 1
                            type: string
                          path:
                            description: |-
                              The attribute in the IdP's user record: a dot path ("name.givenName",
                              "user_metadata.department"), a SCIM extension attribute by its schema
                              URN ("urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:department"),
                              or a SCIM filtered value ("phoneNumbers[type eq \"work\"].value").
                            minLength: 1
                            type: string
                        required:
                        - attribute
                        - path
                        type: object
                      maxItems: 64
                      type: array
                      x-kubernetes-list-map-keys:
                      - attribute
                      x-kubernetes-list-type: map
                    directory:
                      description: |-
                        Where the directory sync reads and writes this IdP's users. oidc
                        tiers only.
                      properties:
                        audience:
                          type: string
                        clientID:
                          type: string
                        credentialsRef:
                          description: |-
                            A Secret with client-secret (and client-id, unless clientID is set):
                            an OAuth client allowed the client_credentials grant at the tier's
                            token endpoint, allowed to read users and, for a failover, update them.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        scopes:
                          description: |-
                            Scopes to request (e.g. "https://jans.io/scim/users.read
                            https://jans.io/scim/users.write").
                          items:
                            type: string
                          type: array
                        type:
                          description: |-
                            scim (SCIM 2.0: Gluu, and most enterprise IdPs), auth0 (Management
                            API v2) or keycloak (admin API, one realm).
                          enum:
                          - scim
                          - auth0
                          - keycloak
                          type: string
                        url:
                          description: |-
                            The API's base URL: .../scim/v2, https://<tenant>/api/v2, or
                            https://<host>/admin/realms/<realm>. Plain http only to a cluster
                            Service (the mesh encrypts it), e.g. a Keycloak whose admin API isn't
                            published.
                          pattern: ^(https://|http://[a-z0-9.-]+\.svc(\.cluster\.local)?(:[0-9]+)?(/|$))
                          type: string
                      required:
                      - credentialsRef
                      - type
                      - url
                      type: object
                      x-kubernetes-validations:
                      - message: an auth0 directory needs audience (the Management
                          API identifier)
                        rule: self.type != 'auth0' || has(self.audience)
                    displayName:
                      type: string
                    drain:
                      description: |-
                        Drained tiers are taken out of rotation but keep working for sessions
                        already in flight.
                      type: boolean
                    enabled:
                      default: true
                      description: |-
                        Disabled tiers are never active (a local one included) and their
                        Keycloak IdP is disabled.
                      type: boolean
                    failoverWhen:
                      default: {}
                      description: 'FailoverRules: which probe failures count against
                        a tier.'
                      properties:
                        invalidDiscovery:
                          default: true
                          type: boolean
                        latencyAboveMs:
                          description: |-
                            Must be below health.timeoutSeconds: a slower answer times out
                            (Unreachable) before its latency is known. Condition RulesEffective
                            is False while one isn't.
                          format: int32
                          minimum: 1
                          type: integer
                        serverError:
                          default: true
                          type: boolean
                        unreachable:
                          default: true
                          type: boolean
                      type: object
                    groups:
                      description: |-
                        How this IdP's groups (or roles) map into the shape's groups
                        (spec.profile.groups), by name. oidc tiers only.
                      properties:
                        claim:
                          description: |-
                            The ID token claim listing the user's groups or roles (e.g. groups, or
                            a namespaced claim such as https://example.com/groups). At sign-in the
                            broker sets the user's shape groups from it, every time.
                          minLength: 1
                          type: string
                      required:
                      - claim
                      type: object
                    name:
                      description: Also the Keycloak identity provider alias.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    oidc:
                      properties:
                        clientAssertionSigningAlg:
                          default: PS256
                          description: |-
                            The algorithm of the realm key kept for client assertions alone (the
                            token-signing key uses RS256, so it is never used here).
                          enum:
                          - PS256
                          type: string
                        clientAuth:
                          default: client_secret_post
                          description: |-
                            How the broker authenticates to the upstream's token endpoint.
                            private_key_jwt (RFC 7523) signs a client assertion with the realm's
                            active key for clientAssertionSigningAlg (a key kept for that alone,
                            published in the realm's JWKS for the upstream to register): no shared
                            secret.
                          enum:
                          - client_secret_post
                          - client_secret_basic
                          - private_key_jwt
                          type: string
                        clientID:
                          description: Falls back to the client-id key of clientSecretRef's
                            Secret.
                          type: string
                        clientSecretRef:
                          description: |-
                            The client secret, for client_secret_post and client_secret_basic. A
                            tier whose Secret or key is missing is NotConfigured: probed, never
                            active.
                          properties:
                            key:
                              default: client-secret
                              type: string
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        issuer:
                          description: Exactly as the upstream publishes it (Auth0's
                            ends in "/").
                          pattern: ^https://
                          type: string
                        scopes:
                          default:
                          - openid
                          - email
                          - profile
                          items:
                            type: string
                          type: array
                        storeTokens:
                          description: |-
                            Keep the upstream's tokens on each user's broker link, for a client the
                            realm allows to read them (Identity Brokering API v2): S&V's egress has
                            the upstream vouch for its users in Cross App Access. Without
                            offline_access in scopes, the stored refresh token ends with the
                            user's session at the upstream.
                          type: boolean
                      required:
                      - issuer
                      type: object
                      x-kubernetes-validations:
                      - message: clientSecretRef is required unless clientAuth is
                          private_key_jwt
                        rule: self.clientAuth == 'private_key_jwt' || has(self.clientSecretRef)
                      - message: clientAuth private_key_jwt needs clientID
                        rule: self.clientAuth != 'private_key_jwt' || (has(self.clientID)
                          && size(self.clientID) > 0)
                    type:
                      enum:
                      - oidc
                      - local
                      type: string
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: oidc tiers need spec.oidc
                    rule: self.type != 'oidc' || has(self.oidc)
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - broker
            - tiers
            type: object
          status:
            properties:
              active:
                description: |-
                  The tier logins go to now (the one Keycloak's redirector points at, or
                  the local tier when it points nowhere).
                type: string
              activeSince:
                format: date-time
                type: string
              broker:
                properties:
                  issuer:
                    description: The realm's public issuer, from its discovery document.
                    type: string
                  signIn:
                    description: |-
                      The broker's clients that sign people in through a browser
                      (authorization code), and where they send people back: the apps that
                      sign in through this broker, whether the edge or the app itself runs
                      the sign-in.
                    items:
                      properties:
                        clientID:
                          type: string
                        redirectURIs:
                          items:
                            type: string
                          type: array
                      required:
                      - clientID
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - clientID
                    x-kubernetes-list-type: map
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              egressNamespace:
                description: |-
                  Where this instance's ServiceEntries are, so they are removed when
                  spec.egress changes or goes away.
                type: string
              observedGeneration:
                format: int64
                type: integer
              sync:
                description: SyncStatus records the scheduled sync's last run.
                properties:
                  created:
                    format: int32
                    type: integer
                  cronJob:
                    description: The CronJob that runs it.
                    type: string
                  failed:
                    format: int32
                    type: integer
                  lastRun:
                    format: date-time
                    type: string
                  lastSuccess:
                    format: date-time
                    type: string
                  message:
                    type: string
                  provisioned:
                    format: int32
                    type: integer
                  schemas:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: |-
                      The attribute paths each IdP's directory has, as last read (names
                      only, never values).
                    type: object
                  updated:
                    format: int32
                    type: integer
                  users:
                    description: |-
                      In the last run: users read, users whose broker profile changed,
                      failover accounts written and created, broker accounts provisioned
                      from the primary, and failures.
                    format: int32
                    type: integer
                  written:
                    format: int32
                    type: integer
                type: object
              tiers:
                items:
                  properties:
                    configured:
                      description: Credentials present (always true for local tiers).
                      type: boolean
                    consecutiveFailures:
                      format: int32
                      type: integer
                    consecutiveSuccesses:
                      format: int32
                      type: integer
                    healthy:
                      type: boolean
                    lastProbe:
                      format: date-time
                      type: string
                    latencyMs:
                      format: int64
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    partitioned:
                      description: |-
                        A DENY AuthorizationPolicy labelled continuity.lab.solo.io/tier=<name>
                        targets the tier's ServiceEntry in the egress namespace. Informational:
                        selection only ever follows the probes.
                      type: boolean
                    reason:
                      type: string
                    redirectURI:
                      description: |-
                        oidc tiers: the callback the upstream client must allow,
                        <broker issuer>/broker/<name>/endpoint.
                      type: string
                    trust:
                      description: |-
                        oidc tiers: S&V's registration at this IdP checked against what the
                        IdP publishes, and whether it accepts the broker's callback. Run every
                        10 minutes, on every spec change, and when the instance's
                        continuity.lab.solo.io/check-trust annotation changes. Informational:
                        selection only ever follows the probes.
                      properties:
                        checkedAt:
                          format: date-time
                          type: string
                        checks:
                          items:
                            description: |-
                              TrustCheck is one property of S&V's registration at an IdP. Unknown: the
                              IdP doesn't publish what the check needs (many omit some discovery
                              fields), which is not a failure.
                            properties:
                              message:
                                type: string
                              name:
                                type: string
                              result:
                                enum:
                                - Pass
                                - Fail
                                - Unknown
                                type: string
                            required:
                            - name
                            - result
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        generation:
                          description: The spec generation and check-trust annotation
                            the checks ran for.
                          format: int64
                          type: integer
                        requested:
                          type: string
                      required:
                      - checkedAt
                      type: object
                    type:
                      type: string
                  required:
                  - configured
                  - healthy
                  - name
                  - partitioned
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              transitions:
                description: Newest last, at most 20.
                items:
                  properties:
                    from:
                      type: string
                    reason:
                      type: string
                    time:
                      format: date-time
                      type: string
                    to:
                      type: string
                  required:
                  - reason
                  - time
                  - to
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
