---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: identitycontinuities.continuity.lab.solo.io
spec:
  group: continuity.lab.solo.io
  names:
    kind: IdentityContinuity
    listKind: IdentityContinuityList
    plural: identitycontinuities
    shortNames:
    - idc
    singular: identitycontinuity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.active
      name: ACTIVE
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IdentityContinuity keeps a broker (Keycloak) signing users in through the
          first healthy tier of an ordered chain of upstream IdPs, with the broker's
          own accounts as a tier. The broker stays the only issuer relying parties
          trust; upstreams only authenticate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              broker:
                properties:
                  keycloak:
                    properties:
                      browserFlow:
                        default: continuity-browser
                        description: Browser flow whose Identity Provider Redirector
                          points at the active tier.
                        type: string
                      credentialsRef:
                        description: |-
                          Secret with client-id and client-secret of a service-account client
                          holding realm-management manage-identity-providers and manage-realm.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      firstBrokerLoginFlow:
                        default: continuity-first-broker-login
                        description: First-broker-login flow for every upstream (links
                          to existing users).
                        type: string
                      realm:
                        type: string
                      url:
                        description: In-cluster base URL of Keycloak (admin API and
                          token endpoint).
                        type: string
                    required:
                    - credentialsRef
                    - realm
                    - url
                    type: object
                required:
                - keycloak
                type: object
              egress:
                description: |-
                  Egress, when set, sends back-channel calls to upstreams outside
                  internalDomains through an egress waypoint (one ServiceEntry per tier).
                properties:
                  internalDomains:
                    default:
                    - lab
                    - svc
                    - cluster.local
                    description: Hosts under these domains are in-cluster names and
                      need no ServiceEntry.
                    items:
                      type: string
                    type: array
                  namespace:
                    type: string
                  waypoint:
                    type: string
                required:
                - namespace
                - waypoint
                type: object
              failback:
                default: Automatic
                description: |-
                  Automatic moves back up the chain as soon as a higher tier is healthy
                  again; Manual stays on the current tier until it fails.
                enum:
                - Automatic
                - Manual
                type: string
              health:
                default: {}
                properties:
                  healthyThreshold:
                    default: 3
                    format: int32
                    minimum: 1
                    type: integer
                  intervalSeconds:
                    default: 5
                    format: int32
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    default: 2
                    format: int32
                    minimum: 1
                    type: integer
                  unhealthyThreshold:
                    default: 2
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              tiers:
                description: 'Ordered: the first eligible, healthy tier is active.'
                items:
                  properties:
                    displayName:
                      type: string
                    drain:
                      description: |-
                        Drained tiers are taken out of rotation but keep working for sessions
                        already in flight.
                      type: boolean
                    enabled:
                      default: true
                      description: |-
                        Disabled tiers are never active (a local one included) and their
                        Keycloak IdP is disabled.
                      type: boolean
                    failoverWhen:
                      default: {}
                      description: 'FailoverRules: which probe failures count against
                        a tier.'
                      properties:
                        invalidDiscovery:
                          default: true
                          type: boolean
                        latencyAboveMs:
                          description: |-
                            Must be below health.timeoutSeconds: a slower answer times out
                            (Unreachable) before its latency is known. Condition RulesEffective
                            is False while one isn't.
                          format: int32
                          minimum: 1
                          type: integer
                        serverError:
                          default: true
                          type: boolean
                        unreachable:
                          default: true
                          type: boolean
                      type: object
                    name:
                      description: Also the Keycloak identity provider alias.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    oidc:
                      properties:
                        clientID:
                          description: Falls back to the client-id key of clientSecretRef's
                            Secret.
                          type: string
                        clientSecretRef:
                          description: 'A tier whose Secret or key is missing is NotConfigured:
                            probed, never active.'
                          properties:
                            key:
                              default: client-secret
                              type: string
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        issuer:
                          description: Exactly as the upstream publishes it (Auth0's
                            ends in "/").
                          pattern: ^https://
                          type: string
                        scopes:
                          default:
                          - openid
                          - email
                          - profile
                          items:
                            type: string
                          type: array
                      required:
                      - clientSecretRef
                      - issuer
                      type: object
                    type:
                      enum:
                      - oidc
                      - local
                      type: string
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: oidc tiers need spec.oidc
                    rule: self.type != 'oidc' || has(self.oidc)
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - broker
            - tiers
            type: object
          status:
            properties:
              active:
                description: |-
                  The tier logins go to now (the one Keycloak's redirector points at, or
                  the local tier when it points nowhere).
                type: string
              activeSince:
                format: date-time
                type: string
              broker:
                properties:
                  issuer:
                    description: The realm's public issuer, from its discovery document.
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              egressNamespace:
                description: |-
                  Where this instance's ServiceEntries are, so they are removed when
                  spec.egress changes or goes away.
                type: string
              observedGeneration:
                format: int64
                type: integer
              tiers:
                items:
                  properties:
                    configured:
                      description: Credentials present (always true for local tiers).
                      type: boolean
                    consecutiveFailures:
                      format: int32
                      type: integer
                    consecutiveSuccesses:
                      format: int32
                      type: integer
                    healthy:
                      type: boolean
                    lastProbe:
                      format: date-time
                      type: string
                    latencyMs:
                      format: int64
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    partitioned:
                      description: |-
                        A DENY AuthorizationPolicy labelled continuity.lab.solo.io/tier=<name>
                        targets the tier's ServiceEntry in the egress namespace. Informational:
                        selection only ever follows the probes.
                      type: boolean
                    reason:
                      type: string
                    redirectURI:
                      description: |-
                        oidc tiers: the callback the upstream client must allow,
                        <broker issuer>/broker/<name>/endpoint.
                      type: string
                    type:
                      type: string
                  required:
                  - configured
                  - healthy
                  - name
                  - partitioned
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              transitions:
                description: Newest last, at most 20.
                items:
                  properties:
                    from:
                      type: string
                    reason:
                      type: string
                    time:
                      format: date-time
                      type: string
                    to:
                      type: string
                  required:
                  - reason
                  - time
                  - to
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
